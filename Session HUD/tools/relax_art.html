// Puts Kenney models together and saves each picture as a 256 px transparent PNG. Every
// picture has the same scale, and the ground point (0, 0, 0) lands at the same place in
// it (x 50%, y 88%), so Relax mode draws them on one ground line.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const api = () => window.pywebview.api;
const log = t => { document.getElementById('log').textContent += t + '\n'; };
const SIZE = 512, OUT = 256, FRAME = 4.6;      // render size, saved size, world units across
const SK = 1.8;                               // Survival Kit is smaller than the town kit

// [kit, model, x, y, z, turn (degrees about the vertical), scale, tilt x, tilt z (degrees)]
// Town-kit walls stand on the +x side of their 1 x 1 cell; a turn of 90 puts one on -z,
// 180 on -x, 270 on +z (the side facing the camera).
const sides = (y, model, front, x = 0) => [
  ['ftk', model, x, y, 0, 0], ['ftk', model, x, y, 0, 90], ['ftk', model, x, y, 0, 180], ['ftk', front, x, y, 0, 270]];
// Colours for houses: paint(parts, roof, walls) tints the roofs and walls of a picture's parts.
const THATCH = '#d0ad5e', SLATE = '#66758a', COAL = '#4a4b55', CLAY = '#cf6f3e', PLUM = '#8a5a80';
const PLASTER = '#f3e8d2', SAND = '#dcc79a', TIMBER = '#94704c';
const KIT = 'variation-a';     // not a colour: the kit's own Models/Textures/variation-a.png
const SHAPE = {
  cottage: [...sides(0, 'wall-wood', 'wall-wood-door'), ['ftk', 'roof-gable', 0, 1, 0, 0], ['ftk', 'chimney', 0.25, 1, -0.25, 0]],
  timber: [...sides(0, 'wall', 'wall-door'), ...sides(1, 'wall-wood-detail-cross', 'wall-wood-window-glass'), ['ftk', 'roof-gable', 0, 2, 0, 90]],
  flat: [...sides(0, 'wall', 'wall-doorway-square'), ...sides(1, 'wall', 'wall-window-glass'), ['ftk', 'roof-flat', 0, 2, 0, 0], ['ftk', 'chimney', -0.2, 2, -0.2, 0]],
  long: [...sides(0, 'wall-wood', 'wall-wood-door', 0.3), ...sides(0, 'wall-wood', 'wall-wood-window-shutters', -0.7),
         ['ftk', 'roof-gable', 0.3, 1, 0, 0], ['ftk', 'roof-gable', -0.7, 1, 0, 0]],
  tall: [...sides(0, 'wall', 'wall-door'), ...sides(1, 'wall', 'wall-window-small'), ...sides(2, 'wall', 'wall-window-round'), ['ftk', 'roof-high-gable', 0, 3, 0, 0]],
  wide: [...sides(0, 'wall', 'wall-door', 0.3), ...sides(0, 'wall', 'wall-window-shutters', -0.7),
         ...sides(1, 'wall-wood', 'wall-wood-window-glass', 0.3), ...sides(1, 'wall-wood', 'wall-wood-window-glass', -0.7),
         ['ftk', 'roof-high-gable', 0.3, 2, 0, 0], ['ftk', 'roof-high-gable', -0.7, 2, 0, 0]],
  wood: [...sides(0, 'wall-wood', 'wall-wood-door', 0.3), ...sides(0, 'wall-wood', 'wall-wood-window-small', -0.7),
         ...sides(1, 'wall-wood', 'wall-wood-window-round', 0.3), ...sides(1, 'wall-wood', 'wall-wood-window-small', -0.7),
         ['ftk', 'roof-gable', 0.3, 2, 0, 0], ['ftk', 'roof-gable', -0.7, 2, 0, 0]],
  narrow: [...sides(0, 'wall', 'wall-door'), ...sides(1, 'wall', 'wall-window-shutters'), ['ftk', 'roof-high-gable', 0, 2, 0, 90]],
};
const CKA = 'ck:variation-a', CKB = 'ck:variation-b';
// One city-kit building, wider by `wide` and taller again by `up` than the kit's.
const block = (m, color, wide = 1.5, up = 1) => [['ck', m, 0, 0, 0, 0, [wide, wide * up, wide], 0, 0, color]];
const at = (parts, dx, dz) => parts.map(([kit, m, x, y, z, ...rest]) => [kit, m, x + dx, y, z + dz, ...rest]);
const paint = (parts, roof, wall) => parts.map(([kit, m, x, y, z, turn, scale = 1, tx = 0, tz = 0]) =>
  [kit, m, x, y, z, turn, scale, tx, tz, m.startsWith('roof') ? roof : m.startsWith('wall') ? wall : null]);
// The Medieval Village kit's models are 2 wide and 3 high to a storey: at this scale, about the
// town kit's. med() scales [model, x, y, z, turn, colour] to pictures' parts.
const MS = 0.33;
const med = list => list.map(([m, x, y, z, t = 0, color = null]) => ['med', m, x * MS, y * MS, z * MS, t, MS, 0, 0, color]);
const DOORS = {Door_Round: ['Door_1_Round', -0.53], Door_Flat: ['Door_1_Flat', -0.53], Window_Wide_Round: ['Window_Wide_Round1', 0], Window_Wide_Flat: ['Window_Wide_Flat1', 0], Window_Thin_Round: ['Window_Thin_Round1', 0]};

const FP = (...walls) => ['Plaster', walls];
const SLATE2 = 'MI_RoundTiles|#7c8aa0', BROWN = 'MI_RoundTiles|#9a7650', MOSS = 'MI_RoundTiles|#7f9460', DUSK = 'MI_RoundTiles|#8d6a8c', THATCH2 = 'MI_RoundTiles|#d7b56a', TEAL = 'MI_RoundTiles|#35b5a5';
// A building of storeys [[kind, walls], ...], walls round it from `front` on +z; windows and doors in
// their holes, a dark room behind them, the roof by `shape` (gable, tower, wide); dx moves it along x.
function city(w, d, storeys, tile, extra = [], shape = 'gable', dx = 0) {
  const o = [], top = storeys.length * 3;
  const wall = (kind, name, x, y, z, t) => {
    const full = name === 'Straight' || name === 'WoodGrid' ? `Wall_${kind}_${name === 'WoodGrid' && kind !== 'Plaster' ? 'Straight' : name}` : `Wall_${kind}_${name}`;
    o.push([full, x, y, z, t]);
    const fill = DOORS[name];
    if (!fill) return;
    const a = t * Math.PI / 180;
    o.push([fill[0], x + fill[1] * Math.cos(a), y, z - fill[1] * Math.sin(a), t]);
  };
  storeys.forEach(([kind, front], f) => {
    const y = f * 3;
    for (let i = 0; i < w; i++) { const x = (i - (w - 1) / 2) * 2; wall(kind, front[i % front.length], x, y, d, 0); wall(kind, 'Straight', x, y, -d, 180); }
    for (let i = 0; i < d; i++) { const z = (i - (d - 1) / 2) * 2; wall(kind, front[(i + 1) % front.length], w, y, z, 90); wall(kind, 'Straight', -w, y, z, 270); }
    for (const [a, b] of [[w, d], [w, -d], [-w, d], [-w, -d]]) o.push(['Corner_Exterior_Wood', a, y, b, 0]);
  });
  const length = d * 2, tiles = w === 3 ? 'Roof_RoundTiles_6x6' : `Roof_RoundTiles_4x${length}`;
  if (shape === 'tower') o.push(['Roof_Tower_RoundTiles', 0, top, 0, 0, tile]);
  else { o.push([tiles, 0, top, 0, 0, tile]); const g = w === 3 ? 'Roof_Front_Brick6' : 'Roof_Front_Brick4'; o.push([g, 0, top, d, 0], [g, 0, top, -d, 180]); }
  return [['box', '#2b2119', dx, top / 2 * MS, 0, 0, [w * 2 * MS * 0.96, top * MS, d * 2 * MS * 0.96]], ...at(med([...o, ...extra]), dx, 0)];
}

               ['ftk', 'roof-high-gable', 0.3, 2, 0, 0], ['ftk', 'roof-high-gable', -0.7, 2, 0, 0]], 0, -0.3), KIT, null),

};
// Moved back from the camera, so that what stands out in front stays inside the picture.
for (const [name, d] of [['shop', 0.15], ['tavern', 0.25], ['sawmill', 0.35], ['warehouse', 0.25], ['farm', 0.35], ['watermill', 0.35], ['windmill', 0.25]])
  PICTURES[name] = at(PICTURES[name], -d, -d);

const loaders = {}, cache = {};
async function loader(kit) {
  if (!loaders[kit]) {
    const tex = await api().texture(kit);
    const manager = new THREE.LoadingManager();
    manager.setURLModifier(url => url.endsWith('colormap.png') ? tex : url);
    loaders[kit] = new GLTFLoader(manager);
  }
  return loaders[kit];
}
async function gltf(kit, name) {
  const key = kit + '/' + name;
  if (!cache[key]) {
    const b64 = await api().model(kit, name);
    const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
    const l = await loader(kit);
    cache[key] = await new Promise((ok, fail) => l.parse(buf, '', ok, fail));
  }
  return cache[key];
}
const medLoader = new GLTFLoader();
async function model(kit, name) {
  if (kit !== 'med') return (await gltf(kit, name)).scene.clone();
  const key = 'med/' + name;
  if (!cache[key]) cache[key] = await medLoader.loadAsync(await api().medieval() + name + '.gltf');
  return cache[key].scene.clone();
}
// The kit's colour map, each pixel's brightness kept and most of its colour replaced.
const painted = {};
async function skin(map, color) {
  if (painted[color]) return painted[color];
  if (color.startsWith('roof:')) return roofed(map, color);
  if (color !== KIT && !color.startsWith('ck:')) return tinted(map, color);
  const [kit, name] = color === KIT ? ['ftk', KIT] : ['ck', color.slice(3)];
  const tex = await new THREE.TextureLoader().loadAsync(await api().variation(kit, name));
  tex.flipY = map.flipY; tex.colorSpace = map.colorSpace; tex.magFilter = map.magFilter; tex.minFilter = map.minFilter;
  return (painted[color] = tex);
}
// The city kit's colour map with its dark roof colour and green accents changed: what makes a
// session's tower a session's, the teal or red of its roof, as in the earlier eras.
function roofed(map, color) {
  const c = document.createElement('canvas');
  c.width = map.image.width; c.height = map.image.height;
  const g = c.getContext('2d');
  g.drawImage(map.image, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), hex = color.slice(5);
  const to = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  for (let i = 0; i < d.data.length; i += 4) {
    const near = ([r, gr, b]) => Math.abs(d.data[i] - r) + Math.abs(d.data[i + 1] - gr) + Math.abs(d.data[i + 2] - b) < 24;
    if (near([0x51, 0x55, 0x66]) || near([0x66, 0x6b, 0x80]) || near([0x38, 0x38, 0x3d]) || near([0x61, 0xcb, 0x8b])) { d.data[i] = to[0]; d.data[i + 1] = to[1]; d.data[i + 2] = to[2]; }
  }
  g.putImageData(d, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.flipY = map.flipY; tex.colorSpace = map.colorSpace; tex.magFilter = map.magFilter; tex.minFilter = map.minFilter;
  return (painted[color] = tex);
}
function tinted(map, color) {
  const c = document.createElement('canvas');
  c.width = map.image.width; c.height = map.image.height;
  const g = c.getContext('2d');
  g.drawImage(map.image, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), t = new THREE.Color(color).convertLinearToSRGB();
  for (let i = 0; i < d.data.length; i += 4) {
    const [r, gr, b] = [d.data[i], d.data[i + 1], d.data[i + 2]], k = Math.min(1.1, (r * 0.3 + gr * 0.59 + b * 0.11) / 150);
    d.data[i] = r * 0.15 + 0.85 * 255 * t.r * k; d.data[i + 1] = gr * 0.15 + 0.85 * 255 * t.g * k; d.data[i + 2] = b * 0.15 + 0.85 * 255 * t.b * k;
  }
  g.putImageData(d, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.flipY = map.flipY; tex.colorSpace = map.colorSpace; tex.magFilter = map.magFilter; tex.minFilter = map.minFilter;
  return (painted[color] = tex);
}

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const camera = new THREE.OrthographicCamera(-FRAME / 2, FRAME / 2, FRAME * 0.88, -FRAME * 0.12, 0.1, 100);
camera.position.set(10, 8.5, 10);
camera.lookAt(0, 0, 0);
const small = document.createElement('canvas');
small.width = small.height = OUT;

// A building's windows alone, warm, for Relax mode to light at night: its blue glass, in
// patches about a window's size, three in four of them on. The same every time.
const WINDOWS = /^metro-([a-h]|tower-.|mall|cafe|level[1-4])$/;
async function windows(name) {
  const d = small.getContext('2d').getImageData(0, 0, small.width, small.height);
  const out = small.getContext('2d').createImageData(d);
  const on = (x, y) => (Math.sin((x >> 4) * 12.9898 + (y >> 3) * 78.233 + name.length) * 43758.5453 % 1 + 1) % 1 < 0.5;
  for (let y = 0, i = 0; y < d.height; y++) for (let x = 0; x < d.width; x++, i += 4) {
    const [r, g, b, a] = [d.data[i], d.data[i + 1], d.data[i + 2], d.data[i + 3]];
    if (a > 128 && b > 150 && b > r * 1.32 && b > g * 1.08 && on(x, y)) {
      out.data[i] = 255; out.data[i + 1] = 214; out.data[i + 2] = 130; out.data[i + 3] = 255;
    }
  }
  const c = document.createElement('canvas');
  c.width = d.width; c.height = d.height;
  c.getContext('2d').putImageData(out, 0, 0);
  await api().save(name + '-lit', c.toDataURL('image/png'));
}

async function picture(name, parts) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a0, 2.4));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(4, 8, 3);
  scene.add(sun);
  for (const [kit, m, x, y, z, turn, scale = 1, tiltX = 0, tiltZ = 0, color = null] of parts) {
    if (kit === 'solid' || kit === 'cyl') {      // a lit shape of one colour: a modern street lamp's parts
      const geo = kit === 'solid' ? new THREE.BoxGeometry(...scale) : new THREE.CylinderGeometry(scale[0], scale[0], scale[1], 12);
      const b = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: m, roughness: 0.6, metalness: 0.2,
        emissive: m === LAMP_LIGHT ? m : 0x000000, emissiveIntensity: m === LAMP_LIGHT ? 0.9 : 0}));
      b.position.set(x, y, z);
      b.rotation.y = turn * Math.PI / 180;
      scene.add(b);
      continue;
    }
    if (kit === 'box') {          // a dark room behind a building's windows
      const b = new THREE.Mesh(new THREE.BoxGeometry(...scale), new THREE.MeshBasicMaterial({color: m}));
      b.position.set(x, y, z);
      scene.add(b);
      continue;
    }
    const o = await model(kit, m);
    if (color) {
      // 'material|colour' paints only that material of a model.
      const [mat, paint] = color.includes('|') ? color.split('|') : [null, color];
      const meshes = [];
      o.traverse(q => { if (q.isMesh && (!mat || q.material.name === mat)) meshes.push(q); });
      for (const q of meshes) { q.material = q.material.clone(); q.material.map = await skin(q.material.map, paint); }
    }
    o.position.set(x, y, z);
    o.rotation.set(tiltX * Math.PI / 180, turn * Math.PI / 180, tiltZ * Math.PI / 180, 'YXZ');
    if (Array.isArray(scale)) o.scale.set(...scale); else o.scale.setScalar(scale);
    scene.add(o);
  }
  // A metropolis and a city are tall: their pictures show twice the world, at twice the pixels.
  const k = /^(metro|med)-/.test(name) ? 2 : 1;
  const view = camera.clone();
  view.left *= k; view.right *= k; view.top *= k; view.bottom *= k;
  view.updateProjectionMatrix();
  renderer.setSize(SIZE * k, SIZE * k);
  renderer.render(scene, view);
  small.width = small.height = OUT * k;
  const g = small.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(renderer.domElement, 0, 0, OUT * k, OUT * k);
  renderer.setSize(SIZE, SIZE);
  if (WINDOWS.test(name)) await windows(name);
  return api().save(name, small.toDataURL('image/png'));
}

// The people: one row per tool, 28 frames of 128 px each: 14 facing the lower right, then
// the same 14 facing the lower left. Of each 14: 0 standing, 1-4 walking, 5-8 working
// (interact), 9-12 waving (emote-yes), 13 sitting. Half the buildings' frame at half the
// size, so a person has the buildings' scale when Relax mode draws a frame at half a
// building's size, its feet at the same 88% line.
const PEOPLE = [['claude', 'character-female-c'], ['codex', 'character-female-e'], ['agy', 'character-male-c']];
const CELL = 128;
// [clip, frames]: each clip's frames are spread over one cycle of it.
const ACTS = [['idle', 1], ['walk', 4], ['interact-right', 4], ['emote-yes', 4], ['sit', 1]];
const PER_DIR = ACTS.reduce((n, [, k]) => n + k, 0);
async function people() {
  const cam = new THREE.OrthographicCamera(-FRAME / 4, FRAME / 4, FRAME / 2 * 0.88, -FRAME / 2 * 0.12, 0.1, 100);
  cam.position.copy(camera.position);
  cam.lookAt(0, 0, 0);
  const sheet = document.createElement('canvas');
  sheet.width = CELL * PER_DIR * 2; sheet.height = CELL * PEOPLE.length;
  const g = sheet.getContext('2d');
  g.imageSmoothingQuality = 'high';
  for (const [row, [, name]] of PEOPLE.entries()) {
    const src = await gltf('mc', name);
    const clip = n => src.animations.find(a => a.name === n);
    for (const [d, turn] of [[0, 90], [1, 0]]) {           // facing +x shows lower right, +z lower left
      let f = 0;
      for (const [name, n] of ACTS) {
        const c = clip(name);
        for (let k = 0; k < n; k++, f++) {
          const scene = new THREE.Scene();
          scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a0, 2.4));
          const sun = new THREE.DirectionalLight(0xffffff, 2.2);
          sun.position.set(4, 8, 3);
          scene.add(sun);
          const o = SkeletonUtils.clone(src.scene);
          o.rotation.y = turn * Math.PI / 180;
          scene.add(o);
          const mixer = new THREE.AnimationMixer(o);
          mixer.clipAction(c).play();
          // One frame: the clip's start (sitting: its end, seated); several: through it.
          mixer.setTime(n === 1 ? (name === 'sit' ? c.duration * 0.99 : 0) : k / n * c.duration);
          renderer.render(scene, cam);
          g.drawImage(renderer.domElement, (d * PER_DIR + f) * CELL, row * CELL, CELL, CELL);
        }
      }
    }
  }
  return api().save('people', sheet.toDataURL('image/png'));
}

// The animals (Quaternius' Ultimate Animated Animal Pack): one row each, in the people's
// layout at the people's scale: 9 frames facing the lower right, then 9 facing the lower left;
// of each 9: 0 standing, 1-4 walking, 5-8 eating. Made only when 'animals' is named.
const ANIMALS = ['Deer', 'Stag', 'Fox', 'Wolf', 'Cow', 'Bull', 'Horse', 'Horse_White', 'Donkey', 'Alpaca', 'Husky', 'ShibaInu'];
const ANIMAL_ACTS = [['Idle', 1], ['Walk', 4], ['Eating', 4]];
async function animals() {
  const cam = new THREE.OrthographicCamera(-FRAME / 4, FRAME / 4, FRAME / 2 * 0.88, -FRAME / 2 * 0.12, 0.1, 100);
  cam.position.copy(camera.position);
  cam.lookAt(0, 0, 0);
  const sheet = document.createElement('canvas');
  sheet.width = CELL * 18; sheet.height = CELL * ANIMALS.length;
  const g = sheet.getContext('2d');
  g.imageSmoothingQuality = 'high';
  const l = new GLTFLoader();
  for (const [row, name] of ANIMALS.entries()) {
    const src = await new Promise(async (ok, fail) => l.parse(await api().animal(name), '', ok, fail));
    for (const [d, turn] of [[0, 90], [1, 0]]) {           // the models face +z: lower left
      let f = 0;
      for (const [act, n] of ANIMAL_ACTS) {
        const c = src.animations.find(a => a.name === act);
        for (let k = 0; k < n; k++, f++) {
          const scene = new THREE.Scene();
          scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a0, 2.4));
          const sun = new THREE.DirectionalLight(0xffffff, 2.2);
          sun.position.set(4, 8, 3);
          scene.add(sun);
          const o = SkeletonUtils.clone(src.scene);
          o.rotation.y = turn * Math.PI / 180;
          o.scale.setScalar(0.17);
          scene.add(o);
          const mixer = new THREE.AnimationMixer(o);
          mixer.clipAction(c).play();
          mixer.setTime(n === 1 ? 0 : k / n * c.duration);
          renderer.render(scene, cam);
          g.drawImage(renderer.domElement, (d * 9 + f) * CELL, row * CELL, CELL, CELL);
        }
      }
    }
  }
  return api().save('animals', sheet.toDataURL('image/png'));
}

// The module may load after pywebview is ready, or before.
async function run() {
  const done = [];
  try {
    const only = await api().only();
    for (const [name, parts] of Object.entries(PICTURES))
      if (!only.length || only.includes(name)) done.push(await picture(name, parts));
    if (!only.length) done.push(await people());
    if (only.includes('animals')) done.push(await animals());
    await api().done('saved:\n' + done.join('\n'));
  } catch (e) {
    log('failed: ' + e);
    await api().done('failed: ' + e + '\n' + done.join('\n'));
  }
}
if (window.pywebview && window.pywebview.api && window.pywebview.api.model) run();
else window.addEventListener('pywebviewready', run);
