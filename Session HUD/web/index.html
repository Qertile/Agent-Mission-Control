<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agent Mission Control</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  /* Classic (the original HUD colors); the other themes (THEMES below) replace these from script. */
  :root { --bg: #060a06; --bar: #0a100a; --line: #16301c; --accent: #33ff66; --title: #8cff8c;
          --desc: #46a05a; --note: #5a9664; --spark: #124d20; --tabon: #12361b; --attn: #4a3d00;
          --busy: #00dcff; --wait: #ffc400; --idle: #8cff8c; --grey: #8c96a0; --red: #ff5a5a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--title);
               font-family: 'DejaVu Sans Mono', Consolas, monospace; font-size: 14px; overflow: hidden; }
  body { display: grid; grid-template-columns: var(--c1, 16%) 5px var(--c2, 42%) 5px 1fr; }
  body.dragging { cursor: col-resize; user-select: none; }
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .split { background: var(--line); cursor: col-resize; }
  .split:hover, body.dragging .split { background: var(--desc); }
  .head { background: var(--bar); color: var(--accent); font-weight: bold; padding: 5px 8px; }
  .note { color: var(--note); font-style: italic; font-size: 11px; padding: 3px 10px; min-height: 14px; }
  #grid-msg:empty { display: none; }
  .click { cursor: pointer; }
  .click:hover { color: var(--accent); }

  /* tasks */
  #task-list { flex: 1; overflow-y: auto; padding: 8px 6px 4px 10px; white-space: pre-wrap; }
  .task { margin-bottom: 14px; }
  .task .t { color: var(--title); }
  .task .d { color: var(--desc); padding-left: 2.2em; text-indent: -1.2em; }
  .task .m { color: var(--note); }
  .st { font-weight: bold; }

  /* usage */
  #usage { position: relative; min-height: 140px; border-bottom: 1px solid var(--bar);
           padding: 8px 210px 4px 12px; box-sizing: border-box; font-size: 13px; }
  #usage .k { color: var(--accent); font-weight: bold; display: inline-block; width: 120px; }
  #usage .v { color: var(--title); }
  #usage .s { color: var(--desc); }
  #usage .d { color: var(--note); font-style: italic; font-size: 11px; }   /* same look as .note */
  #usage .big { font-size: 22px; font-weight: bold; color: var(--title); margin-right: 14px; }
  #usage .row { margin-bottom: 7px; }
  #pies { position: absolute; right: 14px; top: 8px; display: flex; gap: 18px; text-align: center;
          font-weight: bold; background: var(--bg); padding-left: 10px; }
  #pies .cap { color: var(--desc); font-size: 12px; }
  #pies .pct { color: var(--title); font-size: 12px; }

  /* session list */
  #grid-head, .row-s { display: grid; grid-template-columns: 1fr 70px 70px 72px 82px; align-items: center; }
  #grid-head { background: var(--bar); color: var(--accent); font-weight: bold; height: 28px; }
  #grid-head > div, .row-s > div { text-align: center; }
  #grid-head > div:first-child { text-align: left; padding-left: 8px; }
  #grid { flex: 1; overflow-y: auto; }
  .row-s { border-bottom: 1px solid var(--bar); min-height: 48px; cursor: default; }
  .row-s.sel { background: var(--bar); }
  .row-s .who { display: flex; align-items: center; text-align: left; padding: 4px 8px; gap: 8px; min-width: 0; }
  .row-s .who svg { flex-shrink: 0; }
  .row-s .who .txt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row-s .who .sub { color: var(--desc); padding-left: 1.4em; font-size: 12px; white-space: nowrap; }
  .row-s .tabmark { color: var(--accent); }
  .row-s .stat { font-weight: bold; }
  .row-s .upd { font-size: 12px; }
  .row-s > div:not(.who) { font-size: 13px; }

  /* chat boxes */
  .chat { background: var(--bar); padding: 5px 8px 6px; }
  .chat-head { display: flex; justify-content: space-between; font-size: 11px; }
  .chat-head .cap { color: var(--accent); font-weight: bold; }
  .chat-head .status { color: var(--note); font-style: italic; }
  .chat textarea { width: 100%; box-sizing: border-box; margin-top: 3px; resize: none; background: var(--bg);
                   color: var(--title); caret-color: var(--accent); border: 1px solid var(--desc);
                   outline: none; font: inherit; font-size: 14px; padding: 2px 4px; overflow: hidden; }
  .chat textarea:focus { border-color: var(--accent); }

  /* terminals */
  /* No scrollbar: the mouse wheel scrolls the tabs sideways, and Ctrl+Tab brings the tab into view. */
  #tabs { display: flex; background: var(--bar); border-bottom: 1px solid var(--desc); overflow-x: auto;
          scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 6px 14px; cursor: pointer; color: var(--desc); white-space: nowrap; }
  .tab.off { display: none; }
  .tab .x { margin-left: 10px; color: var(--note); }
  .tab .x:hover { color: var(--red); }
  #add-tab { padding: 6px 12px; cursor: pointer; color: var(--desc); font-weight: bold; }
  #add-tab:hover { color: var(--accent); }
  /* The tab typed into: bright, lit and underlined (not bold: the tabs would shift); one
     shown in another pane: underlined dim. */
  .tab.active { color: var(--accent); background: var(--tabon); box-shadow: inset 0 -3px 0 var(--accent); }
  .tab.shown { color: var(--title); background: var(--bg); box-shadow: inset 0 -3px 0 var(--desc); }
  .tab.mark-before { box-shadow: inset 3px 0 0 var(--accent); }    /* where a dragged tab would go */
  .tab.mark-after { box-shadow: inset -3px 0 0 var(--accent); }
  .tab .dot { margin-right: 6px; color: var(--grey); }
  .tab.attn { animation: attn 1s ease-in-out infinite alternate; }  /* finished or waiting, not on screen */
  @keyframes attn { from { background: var(--bar); } to { background: var(--attn); } }
  /* Pinned to the right end of the tab bar, on one line, however many tabs there are. */
  #tab-tools { margin-left: auto; display: flex; flex-shrink: 0; position: sticky; right: 0; background: var(--bar); }
  #tab-tools > div { padding: 0 10px; cursor: pointer; color: var(--desc); font-size: 24px; line-height: 30px; }
  #tab-tools > div:hover, body.wide #wide-btn { color: var(--accent); }
  #terms { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  .term { position: absolute; visibility: hidden; }        /* placed in its pane by amc.render() */
  .term.active { visibility: visible; }
  .term.focus { outline: 1px solid var(--line); outline-offset: 2px; }
  /* Panes: the bars between them drag; a tab dropped on a pane's edge splits it there. */
  .sash { position: absolute; z-index: 2; background: var(--line); }
  .sash.row { cursor: col-resize; }
  .sash.col { cursor: row-resize; }
  .sash:hover, .sash.on { background: var(--desc); }
  #terms.resizing .term { pointer-events: none; }          /* the terminals under the cursor stay out of it */
  .pane-x { position: absolute; z-index: 2; padding: 3px 8px; font-size: 20px; line-height: 1; cursor: pointer;
            color: var(--desc); background: var(--bar); border: 1px solid var(--line); }
  .pane-x:hover { color: var(--accent); border-color: var(--desc); }
  #drop { position: absolute; z-index: 3; display: none; pointer-events: none;
          background: var(--tabon); opacity: 0.6; border: 1px solid var(--accent); }
  /* Wide: the task and session columns are hidden, the panes get the whole window. */
  body.wide { grid-template-columns: 1fr; }
  body.wide > .col:not(#term-col), body.wide > .split { display: none; }
  #no-tabs { color: var(--note); padding: 14px; }

  /* menus and the calendar */
  .menu { position: fixed; z-index: 10; background: var(--bar); border: 1px solid var(--desc); padding: 3px 0;
          min-width: 150px; display: none; }
  .menu div { padding: 4px 14px; cursor: pointer; }
  .menu div:hover { background: var(--bg); color: var(--accent); }
  .menu div.disabled { color: var(--note); pointer-events: none; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
  .menu input { margin: 3px 8px; width: 180px; background: var(--bg); color: var(--title);
                border: 1px solid var(--desc); font: inherit; padding: 2px 4px; outline: none; }
  .menu .err { color: var(--red); cursor: default; padding: 0 10px 3px; font-size: 11px; }
  #cal { position: fixed; z-index: 10; background: var(--bar); border: 1px solid var(--desc); padding: 6px;
         display: none; font-size: 12px; }
  #cal .nav { display: flex; justify-content: space-between; color: var(--accent); margin-bottom: 4px; }
  #cal table { border-collapse: collapse; }
  #cal td { width: 26px; height: 22px; text-align: center; cursor: pointer; color: var(--title); }
  #cal td.hd { color: var(--desc); cursor: default; }
  #cal td.today { color: var(--accent); font-weight: bold; }
  #cal td.cur { background: var(--desc); color: var(--bg); }
  #cal td:not(.hd):hover { background: var(--bg); }
</style>
</head>
<body>
<div class="col">
  <div class="head">Tasks</div>
  <div id="task-list"></div>
  <div class="note" id="task-note"></div>
  <div class="chat" id="task-chat"></div>
</div>
<div class="split" data-col="1"></div>
<div class="col">
  <div class="head">Session Monitor</div>
  <div id="usage"></div>
  <div id="grid-head"><div>Session</div><div>Status</div><div>5h Tok</div><div>Up</div><div>Updated</div></div>
  <div id="grid"></div>
  <div class="note" id="grid-msg"></div>   <!-- kept until the next click; grid-note is redrawn every second -->
  <div class="note" id="grid-note"></div>
</div>
<div class="split" data-col="2"></div>
<div class="col" id="term-col">
  <div id="tabs"><div id="add-tab" title="start a session, or a new one">+</div>
    <div id="tab-tools">
      <div id="wide-btn" title="full width: hide the task and session columns; drag a tab onto a pane's edge to split it">⇔</div>
      <div id="set-btn" title="settings">⚙</div></div></div>
  <div id="terms"><div id="no-tabs">No session running: start one with +.</div><div id="drop"></div></div>
</div>

<div class="menu" id="row-menu">
  <div data-act="copy">Copy</div>
  <div data-act="copyall">Copy all rows</div>
  <hr>
  <div class="disabled">Model</div>
  <hr id="model-end">
  <div data-act="auto">Open on start</div>
  <div data-act="term">Terminate</div>
</div>
<div class="menu" id="status-menu">
  <div>Pending</div><div>Ongoing</div><div>Checking</div><div>Finished</div>
</div>
<div class="menu" id="add-menu"></div>
<div class="menu" id="set-menu"></div>
<div id="cal"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script>
const api = () => window.pywebview.api;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const TASK_STATUS_COLORS = {Ongoing: 'var(--busy)', Checking: 'var(--wait)'};

// ---------------------------------------------------------------- themes
// ui: the page's CSS variables; term: the terminals' colors, the 16 ANSI ones included.
const THEME_KEY = 'amc-theme';
const ansi = (black, red, green, yellow, blue, magenta, cyan, white,
              brightBlack, brightRed, brightGreen, brightYellow, brightBlue, brightMagenta, brightCyan, brightWhite) =>
  ({black, red, green, yellow, blue, magenta, cyan, white,
    brightBlack, brightRed, brightGreen, brightYellow, brightBlue, brightMagenta, brightCyan, brightWhite});
const ui = (bg, bar, line, accent, title, desc, note, spark, tabon, attn, busy, wait, idle, grey, red) =>
  ({bg, bar, line, accent, title, desc, note, spark, tabon, attn, busy, wait, idle, grey, red});
const THEMES = {
  'Classic': {        // the terminals keep xterm.js's own 16 ANSI colors, as before themes
    ui: ui('#060a06', '#0a100a', '#16301c', '#33ff66', '#8cff8c', '#46a05a', '#5a9664', '#124d20', '#12361b',
           '#4a3d00', '#00dcff', '#ffc400', '#8cff8c', '#8c96a0', '#ff5a5a'),
    term: {background: '#060a06', foreground: '#c8e6c8', cursor: '#33ff66', selectionBackground: '#2a5a34'}},
  'Dark': {
    ui: ui('#1e1e1e', '#252526', '#3c3c3c', '#4fa3e0', '#d4d4d4', '#9d9d9d', '#808080', '#264f78', '#37373d',
           '#5a4a1a', '#4fc1ff', '#dcdcaa', '#b5cea8', '#8c8c8c', '#f48771'),
    term: {background: '#1e1e1e', foreground: '#cccccc', cursor: '#aeafad', selectionBackground: '#264f78',
           ...ansi('#000000', '#cd3131', '#0dbc79', '#e5e510', '#2472c8', '#bc3fbc', '#11a8cd', '#e5e5e5',
                   '#666666', '#f14c4c', '#23d18b', '#f5f543', '#3b8eea', '#d670d6', '#29b8db', '#e5e5e5')}},
  'Light': {
    ui: ui('#ffffff', '#f3f3f3', '#d4d4d4', '#005fb8', '#333333', '#616161', '#808080', '#c8ddf0', '#dce8f5',
           '#fff0b3', '#0070c1', '#a06800', '#2e7d32', '#777777', '#c72e2e'),
    term: {background: '#ffffff', foreground: '#333333', cursor: '#333333', selectionBackground: '#add6ff',
           ...ansi('#000000', '#cd3131', '#00a000', '#949800', '#0451a5', '#bc05bc', '#0598bc', '#555555',
                   '#666666', '#cd3131', '#14ce14', '#b5ba00', '#0451a5', '#bc05bc', '#0598bc', '#a5a5a5')}},
  'Monokai': {
    ui: ui('#272822', '#1e1f1c', '#3e3d32', '#a6e22e', '#f8f8f2', '#a59f85', '#75715e', '#3e4a22', '#3e3d32',
           '#5a4a1a', '#66d9ef', '#e6db74', '#a6e22e', '#90908a', '#f92672'),
    term: {background: '#272822', foreground: '#f8f8f2', cursor: '#f8f8f0', selectionBackground: '#49483e',
           ...ansi('#272822', '#f92672', '#a6e22e', '#f4bf75', '#66d9ef', '#ae81ff', '#a1efe4', '#f8f8f2',
                   '#75715e', '#f92672', '#a6e22e', '#f4bf75', '#66d9ef', '#ae81ff', '#a1efe4', '#f9f8f5')}},
  'Solarized Dark': {
    ui: ui('#002b36', '#073642', '#094352', '#268bd2', '#93a1a1', '#839496', '#586e75', '#114b5f', '#0d4a5a',
           '#4a3f00', '#2aa198', '#b58900', '#859900', '#657b83', '#dc322f'),
    term: {background: '#002b36', foreground: '#839496', cursor: '#93a1a1', selectionBackground: '#274642',
           ...ansi('#073642', '#dc322f', '#859900', '#b58900', '#268bd2', '#d33682', '#2aa198', '#eee8d5',
                   '#586e75', '#cb4b16', '#859900', '#b58900', '#268bd2', '#6c71c4', '#2aa198', '#fdf6e3')}},
  'Solarized Light': {
    ui: ui('#fdf6e3', '#eee8d5', '#d9d2bd', '#268bd2', '#586e75', '#657b83', '#93a1a1', '#d5e3ea', '#e3dcc6',
           '#f5e3a0', '#2aa198', '#b58900', '#859900', '#93a1a1', '#dc322f'),
    term: {background: '#fdf6e3', foreground: '#657b83', cursor: '#586e75', selectionBackground: '#e0d9c3',
           ...ansi('#073642', '#dc322f', '#859900', '#b58900', '#268bd2', '#d33682', '#2aa198', '#586e75',
                   '#93a1a1', '#cb4b16', '#859900', '#b58900', '#268bd2', '#6c71c4', '#2aa198', '#073642')}},
  'Dracula': {
    ui: ui('#282a36', '#21222c', '#44475a', '#bd93f9', '#f8f8f2', '#b0b3c6', '#6272a4', '#44395e', '#44475a',
           '#5a4a1a', '#8be9fd', '#f1fa8c', '#50fa7b', '#8a8fa8', '#ff5555'),
    term: {background: '#282a36', foreground: '#f8f8f2', cursor: '#f8f8f2', selectionBackground: '#44475a',
           ...ansi('#21222c', '#ff5555', '#50fa7b', '#f1fa8c', '#bd93f9', '#ff79c6', '#8be9fd', '#f8f8f2',
                   '#6272a4', '#ff6e6e', '#69ff94', '#ffffa5', '#d6acff', '#ff92df', '#a4ffff', '#ffffff')}},
  'Nord': {
    ui: ui('#2e3440', '#3b4252', '#434c5e', '#88c0d0', '#e5e9f0', '#a3b1c6', '#7b88a1', '#3f5160', '#434c5e',
           '#5a4f30', '#88c0d0', '#ebcb8b', '#a3be8c', '#8f9bb3', '#bf616a'),
    term: {background: '#2e3440', foreground: '#d8dee9', cursor: '#d8dee9', selectionBackground: '#434c5e',
           ...ansi('#3b4252', '#bf616a', '#a3be8c', '#ebcb8b', '#81a1c1', '#b48ead', '#88c0d0', '#e5e9f0',
                   '#616e88', '#bf616a', '#a3be8c', '#ebcb8b', '#81a1c1', '#b48ead', '#8fbcbb', '#eceff4')}},
  'Gruvbox Dark': {
    ui: ui('#282828', '#1d2021', '#3c3836', '#fabd2f', '#ebdbb2', '#bdae93', '#928374', '#504945', '#3c3836',
           '#5a4a1a', '#83a598', '#fabd2f', '#b8bb26', '#928374', '#fb4934'),
    term: {background: '#282828', foreground: '#ebdbb2', cursor: '#ebdbb2', selectionBackground: '#504945',
           ...ansi('#282828', '#cc241d', '#98971a', '#d79921', '#458588', '#b16286', '#689d6a', '#a89984',
                   '#928374', '#fb4934', '#b8bb26', '#fabd2f', '#83a598', '#d3869b', '#8ec07c', '#ebdbb2')}},
  'One Dark': {
    ui: ui('#282c34', '#21252b', '#3e4451', '#61afef', '#d7dae0', '#abb2bf', '#7f848e', '#2f4560', '#3e4451',
           '#5a4a1a', '#56b6c2', '#e5c07b', '#98c379', '#7f848e', '#e06c75'),
    term: {background: '#282c34', foreground: '#abb2bf', cursor: '#528bff', selectionBackground: '#3e4451',
           ...ansi('#282c34', '#e06c75', '#98c379', '#e5c07b', '#61afef', '#c678dd', '#56b6c2', '#abb2bf',
                   '#5c6370', '#e06c75', '#98c379', '#e5c07b', '#61afef', '#c678dd', '#56b6c2', '#ffffff')}},
};
let themeName = (() => { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } })();
if (!THEMES[themeName]) themeName = 'Classic';
const termTheme = () => THEMES[themeName].term;
function applyTheme(name) {
  themeName = name;
  for (const [k, v] of Object.entries(THEMES[name].ui)) document.documentElement.style.setProperty('--' + k, v);
  for (const t of Object.values(amc.tabs)) t.term.options.theme = termTheme();
  try { localStorage.setItem(THEME_KEY, name); } catch (e) {}
}

// ---------------------------------------------------------------- terminals
// The panes are a tree, as in VS Code: a leaf {id} shows one tab (id null: none yet),
// a split {dir: 'row' | 'col', sizes, children} lays its children out side by side
// ('row') or one above the other ('col'), sizes being their shares (summing to 1).
// A tab is in at most one pane; the focused pane's tab is the one typed into.
const SASH = 5, MIN_PANE = 120, LAYOUT_KEY = 'amc-layout';
// Read before anything saves: the first tab shown at start would overwrite it.
const SAVED_LAYOUT = (() => { try { return localStorage.getItem(LAYOUT_KEY); } catch (e) { return null; } })();
const amc = {
  tabs: {},            // id -> {name, term, fit, el, tabEl, running}
  pending: {},         // output for a tab the page has not drawn yet
  active: null,        // the tab typed into: the focused pane's
  wide: false,         // the task and session columns hidden
  layout: {id: null},
  focusLeaf: null,     // set below to the layout's one leaf
  rects: new Map(),    // leaf -> {x, y, w, h} in #terms, from the last render
  keep: new Set(),     // tabs restarting (a Model change): their panes stay meanwhile
  dragging: null,      // the tab being dragged onto the panes
  sashOn: null,        // [split, i] of the bar being dragged, kept lit across renders
  status: {},          // id -> last session status, to spot busy -> idle

  output(id, data) {
    const t = amc.tabs[id];
    if (t) t.term.write(data); else amc.pending[id] = (amc.pending[id] || '') + data;
  },

  // Only a running session has a tab; one that ends (Terminate, x, or /exit) loses it,
  // and its pane closes. The tabs stand in agents.json order, which dragging them changes.
  async syncTabs() {
    const list = await api().tabs();
    amc.stopped = list.filter(t => !t.running);
    for (const {id, name, running} of list) {
      if (!running && !amc.tabs[id]) continue;
      if (!amc.tabs[id]) amc.addTab(id, name);
      const t = amc.tabs[id];
      t.running = running;
      t.tabEl.classList.toggle('off', !running);
      if (!running) t.el.classList.remove('active');
      $('tabs').insertBefore(t.tabEl, $('add-tab'));
    }
    $('no-tabs').style.display = list.some(t => t.running) ? 'none' : '';
    amc.prune();
    amc.fill();
  },

  // --- the pane tree
  leaves(node = amc.layout) { return node.children ? node.children.flatMap(c => amc.leaves(c)) : [node]; },
  parentOf(target, node = amc.layout) {
    for (const c of node.children || []) {
      if (c === target) return node;
      const p = amc.parentOf(target, c);
      if (p) return p;
    }
    return null;
  },
  leafOf(id) { return amc.leaves().find(l => l.id === id) || null; },
  live(id) { return !!id && ((amc.tabs[id] && amc.tabs[id].running) || amc.keep.has(id)); },

  // Closes a pane: its neighbours share its space, a split left with one child becomes
  // that child, and the focus goes to the neighbour. The last pane only empties.
  removeLeaf(leaf) {
    const parent = amc.parentOf(leaf);
    if (!parent) { leaf.id = null; return; }
    const i = parent.children.indexOf(leaf);
    parent.children.splice(i, 1);
    parent.sizes.splice(i, 1);
    const sum = parent.sizes.reduce((a, b) => a + b, 0);
    parent.sizes = parent.sizes.map(s => s / sum);
    const next = parent.children[Math.min(i, parent.children.length - 1)];
    if (parent.children.length === 1) {
      const gp = amc.parentOf(parent);
      if (gp) gp.children[gp.children.indexOf(parent)] = next;
      else amc.layout = next;
    }
    if (!amc.leaves().includes(amc.focusLeaf)) amc.focusLeaf = amc.leaves(next)[0];
  },

  // Puts tab `id` in a new pane beside `leaf` (zone left / right / top / bottom); the two
  // share the leaf's space. Returns the new pane.
  split(leaf, zone, id) {
    const dir = zone === 'left' || zone === 'right' ? 'row' : 'col';
    const before = zone === 'left' || zone === 'top';
    const fresh = {id}, parent = amc.parentOf(leaf);
    if (parent && parent.dir === dir) {
      const i = parent.children.indexOf(leaf), half = parent.sizes[i] / 2;
      parent.sizes.splice(i, 1, half, half);
      parent.children.splice(before ? i : i + 1, 0, fresh);
    } else {
      // The leaf becomes the split, so whatever points at it still finds its place.
      const old = {id: leaf.id};
      if (amc.focusLeaf === leaf) amc.focusLeaf = old;
      delete leaf.id;
      Object.assign(leaf, {dir, sizes: [0.5, 0.5], children: before ? [fresh, old] : [old, fresh]});
    }
    return fresh;
  },

  // A tab dropped on a pane: on its middle it replaces the pane's tab, on an edge it
  // gets a new pane there. It leaves the pane it was in.
  move(id, leaf, zone) {
    const from = amc.leafOf(id);
    if (from === leaf) {
      if (zone === 'center') return;
      // Splitting a tab off its own pane: the pane keeps another tab, if there is one.
      const spare = Object.keys(amc.tabs).find(k => amc.live(k) && !amc.leafOf(k));
      if (!spare) return;
      leaf.id = spare;
    } else if (from) {
      amc.removeLeaf(from);
    }
    if (zone === 'center') leaf.id = id;
    else leaf = amc.split(leaf, zone, id);
    amc.focusLeaf = leaf;
    amc.select(id);
  },

  // Panes whose tab ended close; a layout read back is checked the same way.
  prune() {
    const seen = new Set();
    for (const leaf of amc.leaves()) {
      if (!amc.live(leaf.id) || seen.has(leaf.id)) amc.removeLeaf(leaf);
      seen.add(leaf.id);
    }
    if (!amc.leaves().includes(amc.focusLeaf)) amc.focusLeaf = amc.leaves()[0];
  },

  // An empty focused pane gets a running tab that is not on screen.
  fill() {
    amc.active = amc.focusLeaf.id;
    if (!amc.active) {
      const spare = Object.keys(amc.tabs).find(k => amc.live(k) && !amc.leafOf(k));
      if (spare) { amc.select(spare); return; }
    }
    amc.render();
  },

  save() {
    try { localStorage.setItem(LAYOUT_KEY, JSON.stringify({layout: amc.layout, active: amc.active})); } catch (e) {}
  },

  // The layout of the last window, without the tabs that are not running now.
  restore() {
    try {
      const saved = JSON.parse(SAVED_LAYOUT);
      const ok = n => n && (n.children ? Array.isArray(n.sizes) && n.children.length === n.sizes.length &&
                                         n.children.length > 1 && n.children.every(ok) : true);
      if (saved && ok(saved.layout)) {
        amc.layout = saved.layout;
        amc.focusLeaf = amc.leaves()[0];
        amc.prune();
        amc.focusLeaf = amc.leafOf(saved.active) || amc.focusLeaf;
      }
    } catch (e) {
      amc.layout = {id: null};
      amc.focusLeaf = amc.layout;
    }
    amc.fill();
  },

  addTab(id, name) {
    const tabEl = document.createElement('div');
    tabEl.className = 'tab';
    tabEl.innerHTML = `<span class="dot">●</span>${esc(name)}<span class="x" title="end this session">×</span>`;
    tabEl.onclick = e => {
      if (e.target.classList.contains('x')) api().terminate(id, 0);    // its tab goes when it ends
      else amc.select(id);
    };
    // Dragged onto the panes: a pane's middle shows it there, an edge splits the pane.
    tabEl.draggable = true;
    tabEl.addEventListener('dragstart', e => {
      amc.dragging = id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', name);
    });
    tabEl.addEventListener('dragend', () => { amc.dragging = null; $('drop').style.display = 'none'; tabMark(null); });
    $('tabs').insertBefore(tabEl, $('add-tab'));
    const el = document.createElement('div');
    el.className = 'term';
    $('terms').appendChild(el);
    const term = new Terminal({
      fontFamily: "'DejaVu Sans Mono', Consolas, monospace", fontSize: 14, cursorBlink: true,
      scrollback: 5000, allowProposedApi: true,
      theme: termTheme(),
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(el);
    el.addEventListener('mousedown', () => { if (amc.tabs[id] && id !== amc.active) amc.select(id); }, true);
    term.onData(data => api().write(id, data));
    term.onResize(({cols, rows}) => api().resize(id, cols, rows));
    // Ctrl+Shift+C copies the selection; Ctrl+Shift+V is left to the browser's paste,
    // which xterm.js turns into input. Plain Ctrl+C / Ctrl+V still go to the program.
    term.attachCustomKeyEventHandler(e => {
      if (e.type !== 'keydown' || !e.ctrlKey || !e.shiftKey) return true;
      if (e.code === 'KeyC') { copyText(term.getSelection()); term.focus(); return false; }
      if (e.code === 'KeyV') return false;
      return true;
    });
    amc.tabs[id] = {name, term, fit, el, tabEl, running: false};
    if (amc.pending[id]) { term.write(amc.pending[id]); delete amc.pending[id]; }
  },

  // A tab already in a pane gets the focus there; any other replaces the tab in the
  // focused pane.
  select(id) {
    const t = amc.tabs[id];
    if (!t || !t.running) return;
    const leaf = amc.leafOf(id);
    if (leaf) amc.focusLeaf = leaf;
    else amc.focusLeaf.id = id;
    amc.active = id;
    amc.render();
    amc.save();
    t.term.focus();
  },

  // Lays the pane tree out in #terms: places each shown tab, draws the bars between
  // panes and a close button on each pane when there are several, fits the terminals.
  render() {
    document.body.classList.toggle('wide', amc.wide);
    const box = $('terms');
    box.querySelectorAll('.sash, .pane-x').forEach(el => el.remove());
    amc.rects = new Map();
    const several = amc.leaves().length > 1;
    const place = (node, x, y, w, h) => {
      if (!node.children) { amc.rects.set(node, {x, y, w, h}); return; }
      const row = node.dir === 'row', n = node.children.length;
      const free = Math.max(0, (row ? w : h) - SASH * (n - 1));
      let at = row ? x : y;
      node.children.forEach((c, i) => {
        const len = i === n - 1 ? (row ? x + w : y + h) - at : Math.round(free * node.sizes[i]);
        if (row) place(c, at, y, len, h); else place(c, x, at, w, len);
        at += len;
        if (i < n - 1) {
          const bar = document.createElement('div');
          bar.className = 'sash ' + node.dir;
          if (amc.sashOn && amc.sashOn[0] === node && amc.sashOn[1] === i) bar.classList.add('on');
          Object.assign(bar.style, row ? {left: at + 'px', top: y + 'px', width: SASH + 'px', height: h + 'px'}
                                       : {left: x + 'px', top: at + 'px', width: w + 'px', height: SASH + 'px'});
          bar.addEventListener('mousedown', e => amc.dragSash(e, node, i, free));
          box.appendChild(bar);
          at += SASH;
        }
      });
    };
    place(amc.layout, 0, 0, box.clientWidth, box.clientHeight);
    const shown = [];
    for (const [k, x] of Object.entries(amc.tabs)) {
      const leaf = amc.leafOf(k), r = leaf && amc.rects.get(leaf);
      x.el.classList.toggle('active', !!r);
      x.el.classList.toggle('focus', !!r && several && leaf === amc.focusLeaf);
      x.tabEl.classList.toggle('active', k === amc.active);
      x.tabEl.classList.toggle('shown', !!r && k !== amc.active);
      if (!r) continue;
      x.tabEl.classList.remove('attn');
      Object.assign(x.el.style, {left: r.x + 8 + 'px', top: r.y + 4 + 'px',
                                 width: Math.max(0, r.w - 12) + 'px', height: Math.max(0, r.h - 8) + 'px'});
      shown.push(k);
    }
    if (several) {
      for (const [leaf, r] of amc.rects) {
        if (!leaf.id) continue;
        const close = document.createElement('div');
        close.className = 'pane-x';
        close.textContent = '⊟';
        close.title = 'close this pane (the session keeps running)';
        Object.assign(close.style, {right: box.clientWidth - r.x - r.w + 'px', top: r.y + 'px'});
        close.addEventListener('click', () => { amc.removeLeaf(leaf); amc.fill(); amc.save(); });
        box.appendChild(close);
      }
    }
    for (const k of shown) {
      const x = amc.tabs[k];
      x.fit.fit();
      api().resize(k, x.term.cols, x.term.rows);
    }
  },

  // Dragging a bar moves the border between pane i and i+1 of `node`; neither gets
  // smaller than MIN_PANE (or a third of the space, when that is smaller).
  dragSash(e, node, i, free) {
    e.preventDefault();
    const row = node.dir === 'row', start = row ? e.clientX : e.clientY;
    const a = node.sizes[i], b = node.sizes[i + 1], min = Math.min(MIN_PANE, free / 3) / (free || 1);
    document.body.style.cursor = row ? 'col-resize' : 'row-resize';
    $('terms').classList.add('resizing');
    e.target.classList.add('on');
    amc.sashOn = [node, i];
    let frame = 0;
    const move = ev => {
      const d = ((row ? ev.clientX : ev.clientY) - start) / (free || 1);
      const na = Math.min(Math.max(a + d, min), a + b - min);
      node.sizes[i] = na;
      node.sizes[i + 1] = a + b - na;
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; amc.render(); });
    };
    const up = () => {
      removeEventListener('mousemove', move); removeEventListener('mouseup', up);
      document.body.style.cursor = '';
      $('terms').classList.remove('resizing');
      amc.sashOn = null;
      amc.render();
      amc.save();
    };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  },

  // Where a dragged tab would land: the pane under (x, y) in #terms and the zone - its
  // middle, or the edge it is nearest to - with the rectangle to highlight.
  dropAt(x, y) {
    for (const [leaf, r] of amc.rects) {
      if (x < r.x || x >= r.x + r.w || y < r.y || y >= r.y + r.h) continue;
      const fx = (x - r.x) / r.w, fy = (y - r.y) / r.h;
      let zone = 'center';
      if (fx < 0.25 || fx > 0.75 || fy < 0.25 || fy > 0.75) {
        const edges = {left: fx, right: 1 - fx, top: fy, bottom: 1 - fy};
        zone = Object.keys(edges).reduce((m, k) => edges[k] < edges[m] ? k : m);
      }
      const half = {center: r, left: {...r, w: r.w / 2}, right: {...r, x: r.x + r.w / 2, w: r.w / 2},
                    top: {...r, h: r.h / 2}, bottom: {...r, y: r.y + r.h / 2, h: r.h / 2}}[zone];
      return {leaf, zone, area: half};
    }
    return null;
  },

  toggleWide() {
    amc.wide = !amc.wide;
    amc.render();
    const t = amc.tabs[amc.active];
    if (t) t.term.focus();
  },

  // A dot in each tab shows its session's status. A tab not on screen whose session
  // finished (busy -> anything else) or started waiting blinks until it is shown.
  statuses(rows) {
    for (const r of rows) {
      const t = amc.tabs[r.sid];
      if (!t) continue;
      t.tabEl.querySelector('.dot').style.color = r.color;
      t.tabEl.title = r.status;
      const prev = amc.status[r.sid];
      amc.status[r.sid] = r.status;
      const onScreen = t.el.classList.contains('active');
      const done = prev && prev !== r.status && (prev === 'busy' || r.status === 'waiting');
      if (done && !onScreen) t.tabEl.classList.add('attn');
    }
  },

  // + lists the agents.json sessions not running; picking one starts it (it resumes
  // its conversation) and shows its tab.
  async start(id) {
    const err = await api().open_tab(id);
    if (err) { $('grid-note').textContent = err; return; }
    await amc.syncTabs();
    amc.select(id);
  },
};
amc.focusLeaf = amc.layout;
applyTheme(themeName);                     // the saved theme (Classic: :root's own values)

// A tab dragged over the panes: the zone it would land in lights up. Caught on the way
// down, so the terminals' own text areas never take the drop as typed text.
function dropEvent(e) {
  if (!amc.dragging) return null;
  e.preventDefault();
  e.stopPropagation();
  const b = $('terms').getBoundingClientRect();
  return amc.dropAt(e.clientX - b.left, e.clientY - b.top);
}
$('terms').addEventListener('dragover', e => {
  const at = dropEvent(e);
  if (!at) { $('drop').style.display = 'none'; return; }
  e.dataTransfer.dropEffect = 'move';
  const r = at.area;
  Object.assign($('drop').style, {display: 'block', left: r.x + 'px', top: r.y + 'px',
                                  width: r.w + 'px', height: r.h + 'px'});
}, true);
// A tab dragged along the tab bar: a bar marks where it would go - before or after the
// tab under the pointer, by which half it is over - and dropping it moves it there, in
// agents.json too, so the order stays (the session list follows it).
let tabTarget = null;            // [id, after] of the marked spot
function tabMark(target) {
  document.querySelectorAll('.tab.mark-before, .tab.mark-after')
    .forEach(el => el.classList.remove('mark-before', 'mark-after'));
  tabTarget = target;
  if (target) amc.tabs[target[0]].tabEl.classList.add(target[1] ? 'mark-after' : 'mark-before');
}
$('tabs').addEventListener('dragover', e => {
  if (!amc.dragging) return;
  e.preventDefault();
  const el = e.target.closest('.tab');
  const id = el && Object.keys(amc.tabs).find(k => amc.tabs[k].tabEl === el);
  if (!id || id === amc.dragging) { tabMark(null); return; }
  const r = el.getBoundingClientRect();
  e.dataTransfer.dropEffect = 'move';
  tabMark([id, e.clientX > r.left + r.width / 2]);
});
$('tabs').addEventListener('dragleave', e => { if (!$('tabs').contains(e.relatedTarget)) tabMark(null); });
$('tabs').addEventListener('drop', async e => {
  if (!amc.dragging) return;
  e.preventDefault();
  const id = amc.dragging, target = tabTarget;
  amc.dragging = null;
  tabMark(null);
  if (!target) return;
  await api().move_session(id, target[0], target[1]);
  await amc.syncTabs();
});
$('terms').addEventListener('dragleave', e => {
  if (!$('terms').contains(e.relatedTarget)) $('drop').style.display = 'none';
}, true);
// Files dragged in from the file manager: their full paths are typed into the pane
// they are dropped on, quoted when needed, as a terminal does. On Linux the drop
// carries them as file:// URIs; on Windows the page only sees file names, so
// amc_web.py takes the paths from pywebview and hands them to dropFiles.
const isFileDrag = e => !amc.dragging &&
  [...e.dataTransfer.types].some(t => t === 'Files' || t === 'text/uri-list');
$('terms').addEventListener('dragover', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
}, true);
$('terms').addEventListener('drop', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();             // not as text into the terminal, not as a page to open
  const b = $('terms').getBoundingClientRect();
  const at = amc.dropAt(e.clientX - b.left, e.clientY - b.top);
  amc.fileTarget = at && at.leaf.id ? at.leaf.id : amc.active;
  if (amc.fileTarget) amc.select(amc.fileTarget);
  // WebKitGTK leaves text/uri-list empty and puts the URIs in text/html (as links).
  const raw = ['text/uri-list', 'text/html', 'text/plain'].map(t => e.dataTransfer.getData(t) || '').join('\n');
  const uris = [...new Set(raw.match(/file:\/\/[^\s"'<>]+/g) || [])];
  const paths = uris.map(u => decodeURIComponent(new URL(u).pathname).replace(/^\/([A-Za-z]:)/, '$1'));
  amc.droppedHere = paths.length > 0;     // then pywebview's copy of the paths is not typed again
  if (paths.length) amc.typePaths(paths);
}, true);
amc.typePaths = paths => {
  const id = amc.fileTarget || amc.active;
  if (!id || !paths.length) return;
  const win = navigator.platform.startsWith('Win');
  const quote = p => !/[^\w@%+=:,./\\-]/.test(p) ? p
    : win ? `"${p}"` : `'${p.replace(/'/g, `'\\''`)}'`;
  api().write(id, paths.map(quote).join(' ') + ' ');
};
amc.dropFiles = paths => {
  if (amc.droppedHere) { amc.droppedHere = false; return; }
  amc.typePaths(paths);
};
$('terms').addEventListener('drop', e => {
  const at = dropEvent(e), id = amc.dragging;
  $('drop').style.display = 'none';
  amc.dragging = null;
  if (at) amc.move(id, at.leaf, at.zone);
}, true);
$('add-tab').addEventListener('click', e => {
  e.stopPropagation();
  const m = $('add-menu');
  m.innerHTML = ((amc.stopped || []).length
    ? amc.stopped.map(t => `<div data-id="${esc(t.id)}">${esc(t.name)}</div>`).join('')
    : '<div class="disabled">every session is running</div>') +
    '<hr><div data-new="claude">New session…</div><div data-new="codex">New Codex session…</div>';
  const r = $('add-tab').getBoundingClientRect();
  showAt(m, r.left, r.bottom);
});
let newTool = 'claude';
$('add-menu').addEventListener('click', e => {
  // New session: the menu turns into a name box; Enter adds it to agents.json and starts it.
  if (e.target.dataset.new) {
    e.stopPropagation();
    newTool = e.target.dataset.new;

$('add-menu').addEventListener('keydown', async e => {

$('wide-btn').addEventListener('click', () => amc.toggleWide());
// Settings: for now the theme, the current one ticked.
$('set-btn').addEventListener('click', e => {

  const r = $('set-btn').getBoundingClientRect();

$('set-menu').addEventListener('click', e => {

let resizeFrame = 0;
new ResizeObserver(() => {

function copyText(text) {
  if (!text) return;
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove();
}

// ---------------------------------------------------------------- chat boxes
// Enter sends, Shift+Enter is a newline; Up on the first line / Down on the last
// line walk what was sent from that box, like a shell history.
function chatBox(host, target) {
  host.innerHTML = '<div class="chat-head"><span class="cap"></span><span class="status"></span></div>' +
                   '<textarea rows="2"></textarea>';
  const statusEl = host.querySelector('.status');
  const box = host.querySelector('textarea');
  const sent = []; let index = 0;
  host.querySelector('.cap').textContent = 'to ' + target();
  box.addEventListener('keydown', async e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = box.value.trim();
      if (!text) return;
      statusEl.textContent = 'sending...';
      const err = await api().send(target(), text);
      if (err) { statusEl.textContent = err; return; }
      sent.push(text); index = sent.length;
      box.value = '';
      statusEl.textContent = 'sent ' + new Date().toTimeString().slice(0, 8);
    } else if (e.key === 'ArrowUp' && !box.value.slice(0, box.selectionStart).includes('\n')) {
      e.preventDefault();
      if (index > 0) box.value = sent[--index];
    } else if (e.key === 'ArrowDown' && !box.value.slice(box.selectionEnd).includes('\n')) {
      e.preventDefault();
      if (index < sent.length) { index++; box.value = sent[index] ?? ''; }
    }
  });
}
chatBox($('task-chat'), () => 'Task Reminder');

// ---------------------------------------------------------------- usage
function pieSvg(frac) {
  const d = 64, r = d / 2, f = Math.min(1, frac);
  const fill = f >= 0.9 ? 'var(--red)' : f >= 0.7 ? 'var(--wait)' : 'var(--accent)';
  let slice = '';
  if (f >= 0.999) slice = `<circle cx="${r}" cy="${r}" r="${r}" style="fill:${fill}"/>`;
  else if (f > 0) {
    const a = 2 * Math.PI * f, x = r + r * Math.sin(a), y = r - r * Math.cos(a);
    slice = `<path d="M${r},${r} L${r},0 A${r},${r} 0 ${f > 0.5 ? 1 : 0} 1 ${x},${y} Z" style="fill:${fill}"/>`;
  }
  return `<svg width="${d}" height="${d}" viewBox="-1 -1 ${d + 2} ${d + 2}"><circle cx="${r}" cy="${r}" r="${r}" style="fill:var(--bar)"/>` +
         `${slice}<circle cx="${r}" cy="${r}" r="${r}" style="fill:none;stroke:var(--desc)"/></svg>`;
}
function drawUsage(u) {
  if (u.message) { $('usage').innerHTML = `<div class="s">${esc(u.message)}</div>`; return; }
  const pies = u.pies.map(p => `<div><div class="cap">${p.caption}</div>${pieSvg(p.frac)}` +
                               `<div class="pct">${Math.round(Math.min(1, p.frac) * 100)}%</div></div>`).join('');
  $('usage').innerHTML =
    `<div class="row"><span class="k">5H BLOCK</span><span class="big">${esc(u.total)}</span></div>` +
    `<div class="row d">${esc(u.headline)}</div>` +
    `<div class="row d">${esc(u.detail)}</div>` +
    `<div class="row"><span class="k">TODAY/WEEK</span><span class="v">${esc(u.week)}</span></div>` +
    (u.models ? `<div class="row"><span class="k">MODELS</span><span class="s">${esc(u.models)}</span></div>` : '') +
    (u.codex ? `<div class="row"><span class="k">CODEX</span><span class="s">${esc(u.codex)}</span></div>` : '') +
    (pies ? `<div id="pies">${pies}</div>` : '');
}

// ---------------------------------------------------------------- session list
let rows = [], selected = null;
function spark(samples, scale) {
  const w = 110, h = 30, n = 60;
  if (!samples || samples.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const step = w / (n - 1), off = n - samples.length;
  const pts = samples.map((v, k) => [(off + k) * step, h - 1 - (v / scale) * (h - 2)]);
  const line = pts.map(p => p.join(',')).join(' ');
  const area = `${pts[0][0]},${h} ${line} ${pts[pts.length - 1][0]},${h}`;
  return `<svg width="${w}" height="${h}"><polygon points="${area}" style="fill:var(--spark)"/>` +
         `<polyline points="${line}" style="fill:none;stroke:var(--accent)" stroke-width="1.4"/></svg>`;
}
function drawGrid() {
  const scale = Math.max(2048, ...rows.flatMap(r => r.samples));
  $('grid').innerHTML = rows.length ? rows.map((r, i) => `
    <div class="row-s${r.sid === selected ? ' sel' : ''}" data-i="${i}">
      <div class="who"><div class="txt">${r.tab ? '<span class="tabmark">▸</span>' : '▹'} ${esc(r.name)}
        <div class="sub">· ${esc(r.short)}  (pid ${r.pid})</div></div>${spark(r.samples, scale)}</div>
      <div class="stat" style="color:${r.color}">${esc(r.status)}</div>
      <div>${esc(r.tokens)}</div><div>${esc(r.up)}</div><div class="upd" title="${esc(r.updated)}">${esc(r.updated.slice(11))}</div>
    </div>`).join('') : '<div class="note" style="padding:8px">No active sessions</div>';
}
const rowAt = e => { const el = e.target.closest('.row-s'); return el ? rows[+el.dataset.i] : null; };
// The list is redrawn every second, which loses the browser's dblclick, so a second
// click on the same row within 400 ms counts as one.
let lastClick = {sid: null, at: 0};
$('grid').addEventListener('click', e => {
  const r = rowAt(e);
  selected = r ? r.sid : null;
  drawGrid();
  $('grid-msg').textContent = '';
  if (!r) return;
  const double = r.sid === lastClick.sid && e.timeStamp - lastClick.at < 400;
  lastClick = double ? {sid: null, at: 0} : {sid: r.sid, at: e.timeStamp};
  // Double-click a session: its tab, ready to type into.
  if (double) {
    if (r.tab) amc.select(r.sid);
    else $('grid-msg').textContent = `${r.name} runs outside this window`;
  }
});

// The bars between the columns drag; the widths are kept for next time.
const WIDTHS_KEY = 'amc-column-widths';
function setWidths(c1, c2) {
  const total = innerWidth - 10;
  c1 = Math.max(160, Math.min(c1, total - 300 - 420));
  c2 = Math.max(420, Math.min(c2, total - 300 - c1));
  document.body.style.setProperty('--c1', c1 + 'px');
  document.body.style.setProperty('--c2', c2 + 'px');
  return [c1, c2];
}
try {
  const saved = JSON.parse(localStorage.getItem(WIDTHS_KEY));
  if (saved) setWidths(saved[0], saved[1]);
} catch (e) {}
document.querySelectorAll('.split').forEach(bar => bar.addEventListener('mousedown', e => {
  e.preventDefault();
  const cols = document.querySelectorAll('.col');
  const start = e.clientX, w1 = cols[0].offsetWidth, w2 = cols[1].offsetWidth;
  document.body.classList.add('dragging');
  let widths = [w1, w2];
  const move = ev => {
    const dx = ev.clientX - start;
    widths = bar.dataset.col === '1' ? setWidths(w1 + dx, w2 - dx) : setWidths(w1, w2 + dx);
  };
  const up = () => {
    document.body.classList.remove('dragging');
    removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    try { localStorage.setItem(WIDTHS_KEY, JSON.stringify(widths)); } catch (e) {}
  };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
}));
const cells = r => [`${r.name}  ${r.short}  pid ${r.pid}`, r.status, r.tokens, r.up, r.updated].join('\t');
let menuRow = null;
// One item per model of the session's tool under the menu's "Model" label, the
// session's current one marked.
function fillModels(r) {
  const m = $('row-menu');
  m.querySelectorAll('.model-item').forEach(it => it.remove());
  for (const name of ['', ...(r ? r.models : [])]) {
    const it = document.createElement('div');
    it.className = 'model-item';
    it.dataset.act = 'model';
    it.dataset.model = name;
    // No --model / -m: the tool picks, by plan and version.
    const fallback = r && r.tool === 'codex' ? 'Codex default' : 'Claude default';
    it.textContent = (r && r.model === name ? '◉ ' : '○ ') + (name || fallback);
    m.insertBefore(it, $('model-end'));
  }
}
$('grid').addEventListener('contextmenu', e => {
  e.preventDefault();
  menuRow = rowAt(e);
  selected = menuRow ? menuRow.sid : null;
  drawGrid();
  fillModels(menuRow);
  const m = $('row-menu'), items = m.querySelectorAll('[data-act]');
  items.forEach(it => it.classList.toggle('disabled', !menuRow && it.dataset.act !== 'copyall'));
  const auto = m.querySelector('[data-act="auto"]');
  auto.textContent = (menuRow && menuRow.autoOpen ? '☑ ' : '☐ ') + 'Open on start';
  // Open on start and the model live in agents.json: a session outside it has neither.
  for (const it of m.querySelectorAll('[data-act="auto"], [data-act="model"]'))
    it.classList.toggle('disabled', !menuRow || !menuRow.listed);
  showAt(m, e.clientX, e.clientY);
});
$('row-menu').addEventListener('click', async e => {
  const act = e.target.dataset.act, r = menuRow;
  hideMenus();
  if (act === 'copy' && r) copyText(cells(r));
  if (act === 'copyall') copyText(rows.map(cells).join('\n'));
  if (act === 'auto' && r) await api().set_auto_open(r.sid, !r.autoOpen);
  if (act === 'term' && r) await api().terminate(r.sid, r.pid);
  if (act === 'model' && r) {
    // An idle tab restarts on the new model; its pane stays meanwhile, and the focus
    // comes back to it when it had it.
    const wasActive = amc.active === r.sid;
    $('grid-msg').textContent = `${r.name}: setting model…`;
    amc.keep.add(r.sid);
    let msg;
    try { msg = await api().set_model(r.sid, e.target.dataset.model); } finally { amc.keep.delete(r.sid); }
    $('grid-msg').textContent = `${r.name}: ${msg}`;
    await amc.syncTabs();
    if (wasActive && msg.endsWith('restarted')) amc.select(r.sid);
  }
  refresh();
});

// ---------------------------------------------------------------- tasks
let taskEdit = null;
async function refreshTasks() {
  const {tasks, remaining} = await api().task_list();
  $('task-list').innerHTML = tasks.length ? tasks.map((t, i) => {
    const title = t.text.charAt(0).toUpperCase() + t.text.slice(1);
    const color = TASK_STATUS_COLORS[t.status] || (t.status ? 'var(--grey)' : 'var(--note)');
    return `<div class="task"><div class="t">▸ ${esc(title)}</div>` +
      t.description.map(d => `<div class="d">▸ ${esc(d)}</div>`).join('') +
      `<div class="m">&gt;&gt; <span class="click" data-due="${i}">${esc(t.due || 'no due')}</span>` +
      `${' '.repeat(Math.max(1, 12 - (t.due || 'no due').length))}` +
      `<span class="st click" style="color:${color}" data-status="${i}">${esc(t.status || '-')}</span></div></div>`;
  }).join('') : '<div class="m">No open tasks</div>';
  $('task-list').tasks = tasks;
  $('task-note').textContent = remaining > 0 ? `+${remaining} more in tasks.md` : '';
}
$('task-list').addEventListener('click', e => {
  if (String(window.getSelection())) return;     // a drag is copying, not a click on a field
  const list = $('task-list').tasks || [];
  if (e.target.dataset.due !== undefined) {
    taskEdit = list[+e.target.dataset.due];
    openCalendar(taskEdit.due, e.clientX, e.clientY);
  } else if (e.target.dataset.status !== undefined) {
    taskEdit = list[+e.target.dataset.status];
    showAt($('status-menu'), e.clientX, e.clientY);
  } else {
    return;
  }
  e.stopPropagation();           // the click that opened it must not close it again
});
$('status-menu').addEventListener('click', async e => {
  hideMenus();
  if (!taskEdit || e.target.parentElement !== $('status-menu')) return;
  $('task-note').textContent = await api().set_task_status(taskEdit.text, e.target.textContent);
  await refreshTasks();
});

let calMonth = null, calCurrent = null;
function openCalendar(due, x, y) {
  calCurrent = /^\d{4}-\d{2}-\d{2}$/.test(due) ? due : null;
  const d = calCurrent ? new Date(calCurrent + 'T00:00') : new Date();
  calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  drawCalendar();
  showAt($('cal'), x, y);
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function drawCalendar() {
  const m = calMonth, today = ymd(new Date());
  const first = (m.getDay() + 6) % 7;      // Monday first
  const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  let html = `<div class="nav"><span class="click" data-mv="-1">◀</span>` +
             `<span>${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}</span>` +
             `<span class="click" data-mv="1">▶</span></div><table><tr>` +
             ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(h => `<td class="hd">${h}</td>`).join('') + '</tr><tr>';
  for (let i = 0; i < first; i++) html += '<td class="hd"></td>';
  for (let day = 1; day <= days; day++) {
    const s = ymd(new Date(m.getFullYear(), m.getMonth(), day));
    html += `<td data-day="${s}" class="${s === today ? 'today' : ''} ${s === calCurrent ? 'cur' : ''}">${day}</td>`;
    if ((first + day) % 7 === 0 && day < days) html += '</tr><tr>';
  }
  $('cal').innerHTML = html + '</tr></table>';
}
$('cal').addEventListener('click', async e => {
  e.stopPropagation();
  if (e.target.dataset.mv) {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +e.target.dataset.mv, 1);
    drawCalendar();
  } else if (e.target.dataset.day) {
    hideMenus();
    $('task-note').textContent = await api().set_task_due(taskEdit.text, e.target.dataset.day);
    await refreshTasks();
  }
});

// ---------------------------------------------------------------- menus
function showAt(el, x, y) {
  hideMenus();
  el.style.display = 'block';
  el.style.left = Math.min(x, innerWidth - el.offsetWidth - 4) + 'px';
  el.style.top = Math.min(y, innerHeight - el.offsetHeight - 4) + 'px';
}
function hideMenus() { for (const id of ['row-menu', 'status-menu', 'add-menu', 'set-menu', 'cal']) $(id).style.display = 'none'; }
document.addEventListener('click', hideMenus);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideMenus(); });

// Ctrl+Tab / Ctrl+Shift+Tab: the next / previous running tab, in tab bar order. Caught on
// the way down, so a terminal or the chat box never sees it.
document.addEventListener('keydown', e => {
  if (!e.ctrlKey || e.key !== 'Tab') return;
  e.preventDefault();
  e.stopPropagation();
  const order = [...$('tabs').querySelectorAll('.tab:not(.off)')]
    .map(el => Object.keys(amc.tabs).find(k => amc.tabs[k].tabEl === el)).filter(Boolean);
  if (!order.length) return;
  const at = order.indexOf(amc.active);
  const next = order[(at + (e.shiftKey ? -1 : 1) + order.length) % order.length];
  amc.select(next);
  amc.tabs[next].tabEl.scrollIntoView({block: 'nearest', inline: 'nearest'});
}, true);
$('tabs').addEventListener('wheel', e => {
  if (!e.deltaY) return;
  e.preventDefault();
  $('tabs').scrollLeft += e.deltaY;
}, {passive: false});

// ---------------------------------------------------------------- refresh
async function refresh() {
  const s = await api().snapshot();
  rows = s.rows;
  amc.statuses(rows);
  drawGrid();
  drawUsage(s.usage);
  $('grid-note').textContent = s.note;
}
async function init() {
  await api().init();
  await amc.syncTabs();
  amc.restore();
  await refresh();
  await refreshTasks();
  setInterval(refresh, 1000);
  setInterval(refreshTasks, 30000);
}
if (window.pywebview && window.pywebview.api && window.pywebview.api.init) init();
else window.addEventListener('pywebviewready', init);
</script>
</body>
