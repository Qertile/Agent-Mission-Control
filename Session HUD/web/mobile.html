<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a06">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AMC</title>
<link rel="stylesheet" href="xterm.css">
<style>
  :root { --bg: #060a06; --bar: #0a100a; --line: #16301c; --accent: #33ff66; --title: #8cff8c;
          --note: #5a9664; --busy: #00dcff; --wait: #ffc400; --idle: #8cff8c; --grey: #8c96a0; --red: #ff5a5a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--title);
               font-family: 'DejaVu Sans Mono', Consolas, monospace; font-size: 14px; }
  body { display: flex; flex-direction: column; height: 100dvh;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
         box-sizing: border-box; }
  #head { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: var(--bar);
          border-bottom: 1px solid var(--line); }
  #usage { color: var(--note); font-size: 12px; padding: 2px 10px; background: var(--bar);
           border-bottom: 1px solid var(--line); }
  #usage:empty { display: none; }
  #usage b { color: var(--title); font-weight: normal; }
  /* Pinned messages (the same as the desktop's): 📌 count and the latest; tapped, the list. */
  #pins { color: var(--note); font-size: 12px; padding: 3px 10px; background: var(--bar);
          border-bottom: 1px solid var(--line); max-height: 45vh; overflow-y: auto; }
  #pins:empty, body:not(.chat) #pins { display: none; }
  #pins .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pins .pin { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); color: var(--title); }
  #pins .pin div { flex: 1; white-space: pre-wrap; word-break: break-word; }
  #pins .pin small { color: var(--note); display: block; }
  #pins .pin button { align-self: flex-start; padding: 2px 8px; }
  .m.picked { outline: 1px solid var(--note); }
  .m a.dl { color: var(--busy); text-decoration: underline; cursor: pointer; }
  .m .pin-it { display: block; margin-top: 6px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--grey); flex: none; }
  select, button, textarea { font: inherit; color: var(--title); background: var(--bg);
                             border: 1px solid var(--line); border-radius: 4px; }
  select { flex: 1; min-width: 0; padding: 6px; appearance: none; -webkit-appearance: none; }
  button { padding: 6px 10px; flex: none; }
  button:active { background: var(--line); }
  #head button { padding: 6px 7px; }
  #screen { flex: 1; overflow: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  #term { display: inline-block; }
  #chat { padding: 8px; }
  .m { white-space: pre-wrap; word-break: break-word; margin: 0 0 10px; padding: 6px 8px; border-radius: 6px;
       font-size: var(--chat-font, 14px); line-height: 1.4; }
  .m.user { background: var(--line); color: var(--accent); margin-left: 15%; }
  .m.assistant { color: var(--title); }
  /* A Markdown table: a real table, scrolled sideways on its own when it is wider than the screen. */
  .tbl { overflow-x: auto; margin: 4px 0; white-space: normal; }
  .tbl table { border-collapse: collapse; font-size: 0.9em; }
  .tbl th, .tbl td { border: 1px solid var(--note); padding: 3px 6px; vertical-align: top; text-align: left;
                     min-width: 4em; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; }
  .tbl th { color: var(--accent); }
  body.chat #term, body:not(.chat) #chat, body:not(.chat) #thinking, body:not(.busy) #thinking,
  body:not(.chat) #asking, #asking:empty { display: none; }
  /* The question Claude waits on (ask_hook.py): answered with the keys below. */
  #asking { border: 1px solid var(--accent); }
  /* While the session works: the same pulse as a busy tab's dot on the desktop. */
  #thinking { color: var(--note); font-style: italic; padding: 0 16px 10px; font-size: var(--chat-font, 14px);
              animation: pulse 0.8s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: 0.2; } }
  #keys { display: flex; gap: 4px; padding: 4px 8px; overflow-x: auto; border-top: 1px solid var(--line); }
  #keys button { padding: 6px 9px; }
  #send { display: flex; gap: 6px; padding: 4px 8px 8px; }
  textarea { flex: 1; min-width: 0; padding: 6px; resize: none; height: 2.6em; }
  #msg { color: var(--red); font-size: 12px; padding: 0 8px; }
  #msg:empty { display: none; }
  /* + : a new session, under the top bar. */
  #new { display: none; gap: 6px; padding: 6px 8px; background: var(--bar); border-bottom: 1px solid var(--line); }
  body.new #new { display: flex; }
  #new select { flex: none; }
  #new input { flex: 1; min-width: 0; }
  input { font: inherit; padding: 6px; color: var(--title); background: var(--bg);
          border: 1px solid var(--line); border-radius: 4px; }
  /* Tasks: the desktop's task panel, in place of the session. */
  #tasks { display: none; flex: 1; min-height: 0; flex-direction: column; }
  body.tasks #tasks { display: flex; }
  body.tasks #tasks-btn { color: var(--accent); }
  body.tasks #screen, body.tasks #keys, body.tasks #send, body.tasks #usage, body.tasks #pins { display: none; }
  #tasks-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; color: var(--accent); }
  #task-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px; }
  .task { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .task .d { color: var(--grey); font-size: 12px; margin-top: 3px; }
  .task .r { color: var(--accent); font-size: 12px; margin-top: 3px; }
  .task .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; color: var(--note); font-size: 12px; }
  .task .row input, .task .row select { flex: 1 1 0; min-width: 0; padding: 4px; }
  #task-note { color: var(--note); font-size: 12px; padding: 2px 10px; }
  #task-note:empty { display: none; }
  #task-box { display: flex; gap: 6px; padding: 4px 8px 8px; }
  #login { padding: 16px; }
  #login input { font: inherit; width: 100%; box-sizing: border-box; padding: 6px; margin: 8px 0;
                 color: var(--title); background: var(--bg); border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="head">
  <span id="dot"></span>
  <select id="tabs"></select>
  <button id="add" title="new session">+</button>
  <button id="tasks-btn">Tasks</button>
  <button id="view">Term</button>
  <button id="smaller">A−</button><button id="bigger">A+</button>
</div>
<div id="new">
  <select id="new-tool"></select>
  <input id="new-name" placeholder="Session Name" autocomplete="off">
  <button id="new-go">Create</button>
</div>
<div id="usage"></div>
<div id="pins"></div>
<div id="screen"><div id="term"></div><div id="chat"></div><div id="thinking">thinking…</div><div id="asking" class="m assistant"></div></div>
<div id="tasks">
  <div id="tasks-head"><span id="tasks-title">Tasks</span><button id="task-hist">History</button></div>
  <div id="task-list"></div>
  <div id="task-note"></div>
  <div id="task-box"><textarea id="task-text" placeholder="Tell Task Reminder"></textarea><button id="task-go">Send</button></div>
</div>
<div id="msg"></div>
<div id="keys">
  <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
  <button data-key="up">↑</button><button data-key="down">↓</button>
  <button data-key="backspace">⌫</button><button data-key="enter">Enter</button><button data-key="esc">Esc</button>
  <button data-key="shift-tab">⇧Tab</button>
</div>
<div id="send">
  <button id="attach" title="send a photo or a file">📎</button>
  <button id="get" title="get a file from the computer, by its full path">⬇</button>
  <input id="file" type="file" multiple hidden>
  <textarea id="text" placeholder="Message"></textarea>
  <button id="go">Send</button>
</div>
<script src="xterm.js"></script>
<script>
// The token comes once in the link (#t=...), then is kept on the phone and dropped from the address.
function store(k, v) { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) {} return v; }
const fromLink = new URLSearchParams(location.hash.slice(1)).get('t');
if (fromLink) { store('amc-token', fromLink); history.replaceState(null, '', location.pathname); }
const token = store('amc-token');
const $ = id => document.getElementById(id);
const COLORS = {busy: 'var(--busy)', running: 'var(--busy)', waiting: 'var(--wait)', idle: 'var(--idle)'};

if (!token) {
  document.body.innerHTML = '<div id="login">Open the link with its token (…/#t=&lt;token&gt;), or type the token from hud-config.json:' +
    '<input id="tok" autocomplete="off"><button id="ok">OK</button></div>';
  $('ok').onclick = () => { store('amc-token', $('tok').value.trim()); location.reload(); };
  throw new Error('no token');
}

async function call(path, body) {
  const r = await fetch(path, body === undefined ? {headers: {'X-AMC-Token': token}} :
    {method: 'POST', headers: {'X-AMC-Token': token, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (r.status === 403) { store('amc-token', ''); throw new Error('wrong token: open the link with the token again'); }
  return r.json();
}
// Full paths in a text, of this computer's files or the other's: C:\..., /a/b... (two
// parts at least, so "/config" is not one), ~/...; one in backticks may have spaces.
// [{start, end, path}], end not included, trailing punctuation left out.
const PATH_RE = /`((?:[A-Za-z]:\\|~\/|\/)[^`\n]+)`|(^|[\s(\[{"'“「：:,，])((?:[A-Za-z]:\\|~\/|\/[\w.@-]+\/)[^\s"'`<>|*?)\]}」，。；]+)/g;
function findPaths(text) {
  const out = [];
  for (const m of text.matchAll(PATH_RE)) {
    let path = m[1] || m[3], start = m.index + (m[1] ? 1 : m[2].length);
    if (!m[1]) path = path.replace(/[.,;:!?]+$/, '');
    if (path.length > 2) out.push({start, end: start + path.length, path});
  }
  return out;
}
// A file of the computer (GET /api/download, the token in its header) saved on this device,
// with its progress shown by show(text). Returns null or what went wrong.
async function downloadFile(path, show) {
  const name = path.split(/[\\/]/).pop() || 'file', mb = b => (b / 1024 / 1024).toFixed(1);
  show(`downloading ${name}…`);
  try {
    const r = await fetch('/api/download?path=' + encodeURIComponent(path), {headers: {'X-AMC-Token': token}});
    if (!r.ok) {
      let err = `download failed (${r.status})`;
      try { err = (await r.json()).error || err; } catch (e) {}
      show('');
      return err;
    }
    const total = +r.headers.get('Content-Length') || 0, reader = r.body.getReader(), parts = [];
    for (let got = 0; ;) {
      const {done, value} = await reader.read();
      if (done) break;
      parts.push(value);
      got += value.length;
      show(`downloading ${name} ${total ? Math.round(got / total * 100) + '% ' : ''}(${mb(got)} / ${mb(total)} MB)`);
    }
    const url = URL.createObjectURL(new Blob(parts, {type: r.headers.get('Content-Type') || 'application/octet-stream'}));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    show('');
    return null;
  } catch (e) {
    show('');
    return `${name}: download failed: ${e.message}`;
  }
}
// Text with its full paths as links: tapped, the file comes to this phone.
function linkPaths(text) {
  let html = '', at = 0;
  for (const p of findPaths(text)) {
    html += esc(text.slice(at, p.start)) + `<a class="dl" data-path="${esc(p.path)}">${esc(p.path)}</a>`;
    at = p.end;
  }
  return html + esc(text.slice(at));
}
// A message's text, with its Markdown tables as tables (the rest stays as written).
// A table is two or more lines starting with "|" whose second line is the |---| row.
function render(text) {
  const lines = text.split('\n'), out = [];
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => linkPaths(c.trim().replace(/\*\*/g, '')));
  for (let i = 0; i < lines.length;) {
    if (/^\s*\|/.test(lines[i]) && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1] || '') && (lines[i + 1] || '').includes('-')) {
      let j = i + 2;
      while (j < lines.length && /^\s*\|/.test(lines[j])) j++;
      const head = cells(lines[i]).map(c => `<th>${c}</th>`).join('');
      const body = lines.slice(i + 2, j).map(l => '<tr>' + cells(l).map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
      out.push({table: `<div class="tbl"><table><tr>${head}</tr>${body}</table></div>`});
      i = j;
    } else {
      out.push({text: lines[i]});
      i++;
    }
  }
  // Text lines keep their line breaks; a table takes the place of its lines.
  let html = '', prev = null;
  for (const p of out) {
    if (p.table) { html += p.table; prev = 'table'; continue; }
    html += (prev === 'text' ? '\n' : '') + linkPaths(p.text);
    prev = 'text';
  }
  return html;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]); }
function say(text) { $('msg').textContent = text || ''; }

let font = +(store('amc-font') || 9);
const term = new Terminal({fontFamily: "'DejaVu Sans Mono', Consolas, monospace", fontSize: font,
  scrollback: 5000, disableStdin: true, cursorBlink: false,
  theme: {background: '#060a06', foreground: '#8cff8c', cursor: '#33ff66'}});
term.open($('term'));

let tabs = [], current = store('amc-tab') || '', since = 0, size = '', said = -1;
// Chat shows only the typed messages and the replies (Claude, Codex); Term shows the
// terminal, needed to see a permission prompt. Antigravity has Term only.
let wantChat = store('amc-view') !== 'term';
function chatView() { const t = tabs.find(t => t.id === current); return wantChat && !!t && t.tool !== 'agy'; }
function drawView() {
  document.body.classList.toggle('chat', chatView());
  const t = tabs.find(t => t.id === current);
  $('view').textContent = chatView() ? 'Term' : 'Chat';
  // Antigravity: no Chat (its conversations are binary). Greyed but still pressable, to say so.
  $('view').disabled = !t;
  $('view').style.opacity = t && t.tool === 'agy' ? 0.4 : '';
}

function showStatus(status) {
  $('dot').style.background = COLORS[status] || 'var(--grey)';
  document.body.classList.toggle('busy', status === 'busy' || status === 'running');
}
function drawTabs() {
  const sel = $('tabs');
  // Running tabs on top; closed ones under History, as in the desktop's + menu. Picking one opens it.
  const open = tabs.filter(t => t.running), closed = tabs.filter(t => !t.running);
  if (!open.some(t => t.id === current)) reset((open[0] || {}).id || '');
  sel.innerHTML = (open.length ? '' : '<option value="">(no session running)</option>') +
    open.map(t => `<option value="${esc(t.id)}">${esc(t.name)} · ${esc(t.status || '-')}</option>`).join('') +
    (closed.length ? '<optgroup label="History">' +
      closed.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('') + '</optgroup>' : '');
  sel.value = current;
  const t = tabs.find(t => t.id === current);
  showStatus(t && t.status);
  drawView();
}
async function loadTabs() {
  try { tabs = await call('/api/tabs'); drawTabs(); say(''); } catch (e) { say(e.message); }
}
function reset(id) {
  if (id === current) return;
  current = id; store('amc-tab', id); since = 0; size = ''; said = -1; term.reset(); $('chat').innerHTML = '';
  asked = ''; $('asking').innerHTML = ''; pinsJson = ''; pinsOpen = false; $('pins').innerHTML = '';
}
function pick(id) { reset(id); drawTabs(); }

let asked = '';                            // the question shown in #asking
let shownMsgs = [], pinsJson = '', pinsOpen = false;

// Pinning: tap a message, then its 📌 Pin. The pins are the session's on the desktop too.
$('chat').addEventListener('click', async e => {
  const link = e.target.closest('a.dl');
  // What went wrong in a box: the line under the screen is cleared by the next refresh.
  if (link) { const err = await downloadFile(link.dataset.path, say); if (err) alert(err); return; }
  const m = e.target.closest('.m[data-i]');
  if (!m || getSelection().toString()) return;
  if (e.target.classList.contains('pin-it')) {
    e.target.remove(); m.classList.remove('picked');
    try { await call('/api/pin', {id: current, text: shownMsgs[m.dataset.i].text}); say(''); } catch (err) { say(err.message); }
    return;
  }
  const was = m.classList.contains('picked');
  $('chat').querySelectorAll('.picked').forEach(x => { x.classList.remove('picked'); x.querySelector('.pin-it')?.remove(); });
  if (!was) { m.classList.add('picked'); m.insertAdjacentHTML('beforeend', '<button class="pin-it">📌 Pin</button>'); }
});
function drawPins(pins, force) {
  const j = JSON.stringify(pins);
  if (j === pinsJson && !force) return;
  pinsJson = j;
  if (!pins.length) { $('pins').innerHTML = ''; pinsOpen = false; return; }
  const last = pins[pins.length - 1].text.split('\n')[0];
  $('pins').innerHTML = `<div class="line">📌 ${pins.length} · ${esc(last)}</div>` + (pinsOpen ? pins.map(p =>
    `<div class="pin"><div>${esc(p.text)}<small>${esc(p.at)}</small></div><button data-pin="${esc(p.id)}">×</button></div>`).join('') : '');
}
$('pins').addEventListener('click', async e => {
  const id = e.target.dataset.pin;
  if (id) {
    try { await call('/api/unpin', {id: current, pin: id}); say(''); } catch (err) { say(err.message); }
    return;
  }
  if (e.target.closest('.line')) { pinsOpen = !pinsOpen; drawPins(JSON.parse(pinsJson), true); }
});
async function pollChat() {
  const id = current, o = await call(`/api/chat?id=${encodeURIComponent(id)}&since=${said}`);
  if (id !== current || !o.chat) return;
  const was = document.body.classList.contains('busy');
  showStatus(o.status);
  drawPins(o.pins || []);
  if (asked !== (o.asking || '')) {
    asked = o.asking || '';
    $('asking').innerHTML = asked ? render(asked) : '';
    if (o.asking) $('screen').scrollTop = $('screen').scrollHeight;
  }
  if (o.total === said) {
    if (!was && document.body.classList.contains('busy')) $('screen').scrollTop = $('screen').scrollHeight;
    return;
  }
  const screen = $('screen'), atEnd = said < 0 || screen.scrollTop + screen.clientHeight >= screen.scrollHeight - 40;
  shownMsgs = o.messages;
  $('chat').innerHTML = o.messages.map((m, i) => `<div class="m ${m.who === 'user' ? 'user' : 'assistant'}" data-i="${i}">${render(m.text)}</div>`).join('')
    || '<div class="m assistant">(no messages yet)</div>';
  said = o.total;
  if (atEnd) screen.scrollTop = screen.scrollHeight;
}

async function poll() {
  if (current && chatView()) {
    try { await pollChat(); } catch (e) { say(e.message); }
  } else if (current) {
    try {
      const id = current, o = await call(`/api/out?id=${encodeURIComponent(id)}&since=${since}`);
      if (id === current) {
        if (o.size && o.size.join() !== size) { size = o.size.join(); term.resize(o.size[0], o.size[1]); }
        if (o.reset) term.reset();
        if (o.data) {
          const screen = $('screen'), atEnd = screen.scrollTop + screen.clientHeight >= screen.scrollHeight - 20;
          term.write(o.data, () => { if (atEnd) screen.scrollTop = screen.scrollHeight; });
        }
        since = o.end;
      }
    } catch (e) { say(e.message); }
  }
  setTimeout(poll, 400);
}

$('tabs').onchange = async e => {
  const id = e.target.value, t = tabs.find(t => t.id === id);
  if (t && !t.running) {
    e.target.value = current;
    say('opening ' + t.name + '…');
    const r = await call('/api/open', {id}).catch(err => ({error: err.message}));
    if (r.error) return say(r.error);
    await loadTabs();
  }
  pick(id);
};
$('view').onclick = () => {
  const t = tabs.find(t => t.id === current);
  if (t && t.tool === 'agy') return say('Antigravity has no Chat view (its conversations cannot be read): Term only');
  wantChat = !chatView(); store('amc-view', wantChat ? 'chat' : 'term'); drawView();
  const screen = $('screen'); screen.scrollTop = screen.scrollHeight;
};
function setFont() { term.options.fontSize = font; document.body.style.setProperty('--chat-font', (font + 5) + 'px'); store('amc-font', font); }
setFont();
$('smaller').onclick = () => { font = Math.max(5, font - 1); setFont(); };
$('bigger').onclick = () => { font = Math.min(20, font + 1); setFont(); };
document.querySelectorAll('#keys button').forEach(b => b.onclick = async () => {
  const r = await call('/api/key', {id: current, key: b.dataset.key}).catch(e => ({error: e.message}));
  say(r.error);
});
// 📎: each file chosen goes to the computer (POST /api/upload, at most 500 MB) and its path
// is added to the message box, to send with a few words ("look at this").
const UPLOAD_MAX = 500 * 1024 * 1024;
function upload(file) {
  return new Promise(ok => {
    if (file.size > UPLOAD_MAX) return ok({error: `${file.name}: over 500 MB`});
    const x = new XMLHttpRequest();
    x.open('POST', '/api/upload');
    x.setRequestHeader('X-AMC-Token', token);
    x.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
    x.upload.onprogress = e => { if (e.lengthComputable) say(`uploading ${file.name} ${Math.round(e.loaded / e.total * 100)}%`); };
    x.onload = () => { try { ok(JSON.parse(x.responseText)); } catch (e) { ok({error: 'upload failed (' + x.status + ')'}); } };
    x.onerror = () => ok({error: 'upload failed: no connection'});
    x.send(file);
  });
}
$('attach').onclick = () => $('file').click();
// ⬇: a file of the computer by its full path, for one the Term view shows (not a link there).
$('get').onclick = async () => {
  const path = (prompt('Full path of the file on the computer:', '') || '').trim();
  const err = path && await downloadFile(path, say);
  if (err) alert(err);
};
$('file').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  for (const f of files) {
    const r = await upload(f);
    if (r.error) { say(r.error); return; }
    const box = $('text');
    box.value = (box.value && !/\s$/.test(box.value) ? box.value + ' ' : box.value) + r.path + ' ';
  }
  say('');
  $('text').focus();
};
$('go').onclick = async () => {
  const text = $('text').value;
  if (!text.trim() || !current) return;
  $('go').disabled = true;
  const r = await call('/api/send', {id: current, text}).catch(e => ({error: e.message}));
  $('go').disabled = false;
  if (!r.error) $('text').value = '';
  say(r.error);
};

// +: a new session on the computer, with one of the AI tools installed there.
const TOOL_LABELS = {claude: 'Claude', codex: 'Codex', agy: 'Agy'};
$('add').onclick = async () => {
  if (document.body.classList.toggle('new')) {
    const d = await call('/api/tools').catch(e => { say(e.message); return null; });
    if (!d) return;
    if (!d.installed.length) { document.body.classList.remove('new'); return say('no AI tool is installed on the computer'); }
    $('new-tool').innerHTML = d.installed.map(t => `<option value="${t}">${TOOL_LABELS[t]}</option>`).join('');
    $('new-tool').value = d.tool;
    $('new-name').focus();
  }
};
async function newSession(replace) {
  const name = $('new-name').value;
  const r = await call('/api/new', {name, tool: $('new-tool').value, replace}).catch(e => ({error: e.message}));
  if (r.exists) {
    if (confirm(`"${name.trim()}" already exists. Replace it? Its tab closes; its conversation stays in the tool's history.`)) newSession(true);
    return;
  }
  if (r.error) return say(r.error);
  say('');
  $('new-name').value = '';
  document.body.classList.remove('new', 'tasks');
  await loadTabs();
  pick(r.id);
}
$('new-go').onclick = () => newSession(false);
$('new-name').onkeydown = e => { if (e.key === 'Enter') newSession(false); };

// Tasks: the same list as the desktop's. A task's date and status are changed where they
// show; Finished and Discard ask for the result or reason, as the desktop does.
let taskHistory = false, taskRows = [], tasksJson = '';
const STATUSES = ['Pending', 'Ongoing', 'Checking', 'Finished', 'Discard'];
function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function drawOpenTasks(d) {
  taskRows = d.tasks;
  $('task-list').innerHTML = taskRows.map((t, i) => {
    const known = !t.status || STATUSES.includes(t.status);
    return `<div class="task"><div>▸ ${esc(capital(t.text))}</div>` +
      t.description.map(x => `<div class="d">▸ ${esc(x)}</div>`).join('') +
      `<div class="row"><input type="date" data-due="${i}" value="${/^\d{4}-\d{2}-\d{2}$/.test(t.due) ? esc(t.due) : ''}">` +
      `<select data-status="${i}">${t.status ? '' : '<option value="">-</option>'}${known ? '' : `<option>${esc(t.status)}</option>`}` +
      STATUSES.map(s => `<option${s === t.status ? ' selected' : ''}>${s}</option>`).join('') + '</select></div></div>';
  }).join('') || '<div class="task d">No open tasks</div>';
}
function drawDoneTasks(done) {
  taskRows = done;
  $('task-list').innerHTML = done.map((t, i) => `<div class="task"><div>${t.discarded ? '✗' : '✓'} ${esc(capital(t.text))}</div>` +
    t.results.map(r => (r.subitem ? `<div class="d">▸ ${esc(r.subitem)}</div>` : '') +
                       (r.result ? `<div class="r">→ ${esc(r.result)}</div>` : '')).join('') +
    `<div class="row"><span style="flex:1">${esc(t.added || '?')} → ${esc(t.done || '?')}</span>` +
    `<button data-restore="${i}">Restore</button></div></div>`).join('') || '<div class="task d">No finished or discarded tasks</div>';
}
// Drawn again only when something changed, so the 10 seconds' refresh leaves an open picker alone.
async function loadTasks() {
  const was = taskHistory, d = await call(was ? '/api/task-history' : '/api/tasks');
  const j = was + JSON.stringify(d);
  if (was !== taskHistory || j === tasksJson) return;
  tasksJson = j;
  was ? drawDoneTasks(d) : drawOpenTasks(d);
}
async function taskChange(path, body) {
  const r = await call(path, body).catch(e => ({note: e.message}));
  $('task-note').textContent = r.note || '';
  tasksJson = '';
  await loadTasks().catch(e => say(e.message));
}
$('tasks-btn').onclick = () => {
  const on = document.body.classList.toggle('tasks');
  if (on) { tasksJson = ''; loadTasks().catch(e => say(e.message)); }
};
$('task-hist').onclick = () => {
  taskHistory = !taskHistory;
  $('task-hist').textContent = taskHistory ? 'Open' : 'History';
  $('tasks-title').textContent = taskHistory ? 'Tasks · history' : 'Tasks';
  $('task-note').textContent = '';
  tasksJson = '';
  $('task-list').scrollTop = 0;
  loadTasks().catch(e => say(e.message));
};
let dueTimer = null;
$('task-list').addEventListener('change', e => {
  const {due, status} = e.target.dataset;
  if (due !== undefined && e.target.value) {
    // iOS reports each turn of the date wheel: only the last one counts.
    clearTimeout(dueTimer);
    const title = taskRows[+due].text, day = e.target.value;
    dueTimer = setTimeout(() => taskChange('/api/task-due', {title, due: day}), 800);
  } else if (status !== undefined) {
    const t = taskRows[+status], s = e.target.value;
    let result = '';
    if (s === 'Finished' || s === 'Discard') {
      result = prompt(s === 'Finished' ? 'The result (empty = finished):' : 'Why discard it (empty = discarded):', '');
      if (result === null) { e.target.value = t.status || ''; return; }
    }
    taskChange('/api/task-status', {title: t.text, status: s, result});
  }
});
$('task-list').addEventListener('click', e => {
  if (e.target.dataset.restore === undefined) return;
  const t = taskRows[+e.target.dataset.restore];
  taskChange('/api/task-restore', {title: t.text, discarded: !!t.discarded});
});
$('task-go').onclick = async () => {
  const text = $('task-text').value;
  if (!text.trim()) return;
  $('task-go').disabled = true;
  const r = await call('/api/task-send', {text}).catch(e => ({error: e.message}));
  $('task-go').disabled = false;
  if (!r.error) $('task-text').value = '';
  $('task-note').textContent = r.error || 'sent: the reply is in the Task Reminder session';
};
setInterval(() => { if (document.body.classList.contains('tasks')) loadTasks().catch(() => {}); }, 10000);

// Each tool's limits in percent used, the same numbers as the desktop's usage panel.
async function loadUsage() {
  try {
    const u = await call('/api/usage');
    $('usage').innerHTML = u.map(t => `<div><b>${esc(t.tool)}</b> ` +
      t.limits.map(l => `${esc(l.caption)} ${l.pct}%`).join(' · ') + '</div>').join('');
  } catch (e) {}
}
loadUsage();
setInterval(loadUsage, 30000);
loadTabs().then(poll);
setInterval(loadTabs, 3000);
</script>
</body>
</html>
