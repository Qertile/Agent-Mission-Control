# Settings for the "amc" tmux server the agent tabs run in (tmux -L amc).
# tmux is there only so Agent Mission Control can type into a tab; it should
# otherwise look and behave like a plain terminal tab.
set -g status off
# Wheel scrolls the tab's history (without this the wheel reaches Claude Code
# as arrow keys). Hold Shift to select text with the mouse as usual.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
# The terminal tab shows the title Claude Code sets, e.g. "✳ Main".
set -g set-titles on
set -g set-titles-string "#T"
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
